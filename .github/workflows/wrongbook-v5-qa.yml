name: Wrongbook V5 rendered QA
on:
  push:
    branches:
      - agent/wrongbook-concepts-tutor-v5-20260814
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --directory . > /tmp/wrongbook-http.log 2>&1 &
          echo $! > /tmp/wrongbook-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/wrongbook-v2/ >/dev/null && break; sleep 1; done
      - name: Render, regression, persistence, stress, and live backend QA
        run: node .github/scripts/wrongbook-v5-qa.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-v5-rendered-qa
          path: .qa-artifacts/wrongbook-v5
