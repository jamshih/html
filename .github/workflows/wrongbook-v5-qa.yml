name: Wrongbook V5 rendered QA
on:
  push:
    branches:
      - agent/wrongbook-concepts-tutor-v5-20260814
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --directory . > /tmp/wrongbook-http.log 2>&1 &
          echo $! > /tmp/wrongbook-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/wrongbook-v2/ >/dev/null && break; sleep 1; done
      - name: Render, regression, and backend contract QA
        run: |
          mkdir -p .qa-artifacts/wrongbook-v5
          cat > .wrongbook-v5-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const viewports=[['desktop',1440,900],['tablet-landscape',1366,1024],['ipad-portrait',1024,1366],['phone',390,844],['small-phone',375,667]];
          const browser=await chromium.launch({headless:true});
          let failed=false;
          for(const [name,width,height] of viewports){
            const page=await browser.newPage({viewport:{width,height}});const errors=[];const badResponses=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('response',r=>{if(r.status()>=400)badResponses.push(`${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:8000/wrongbook-v2/?e2eproduct=1',{waitUntil:'networkidle'});
            await page.waitForSelector('#e2e-product-v5-results',{timeout:20000});
            const status=await page.locator('#e2e-product-v5-results').getAttribute('data-status');
            const result=await page.locator('#e2e-product-v5-results').textContent();
            await page.screenshot({path:`.qa-artifacts/wrongbook-v5/${name}.png`,fullPage:true});
            fs.writeFileSync(`.qa-artifacts/wrongbook-v5/${name}.json`,JSON.stringify({status,result:JSON.parse(result),errors,badResponses},null,2));
            if(status!=='PASS'||errors.length||badResponses.some(x=>!x.includes('favicon'))){failed=true;console.error(name,{status,errors,badResponses,result})}
            await page.close();
          }
          // Historical suite must still pass at desktop, including Earth source-fidelity checks.
          const legacy=await browser.newPage({viewport:{width:1440,height:900}});const legacyErrors=[];
          legacy.on('console',m=>{if(m.type()==='error')legacyErrors.push(m.text())});legacy.on('pageerror',e=>legacyErrors.push('pageerror: '+e.message));
          await legacy.goto('http://127.0.0.1:8000/wrongbook-v2/?e2e=1',{waitUntil:'networkidle'});
          await legacy.waitForSelector('#e2e-results',{timeout:25000});await legacy.waitForTimeout(5000);
          const legacyStatus=await legacy.locator('#e2e-results').getAttribute('data-status');const legacyText=await legacy.locator('#e2e-results').textContent();
          fs.writeFileSync('.qa-artifacts/wrongbook-v5/legacy.json',JSON.stringify({status:legacyStatus,result:JSON.parse(legacyText),errors:legacyErrors},null,2));
          await legacy.screenshot({path:'.qa-artifacts/wrongbook-v5/legacy.png',fullPage:true});
          if(legacyStatus!=='PASS'||legacyErrors.length){failed=true;console.error('legacy',{legacyStatus,legacyErrors,legacyText})}

          // Live Edge Function contract QA: health + auth/error behavior + valid structured requests.
          const key='sb_publishable_Nt8ik0KBWLdi8hucG9oDRQ_cnMyQ9Gx';
          const root='https://rfpkznuntzxfoeeavwwf.supabase.co/functions/v1';
          const backend={health:{},errors:{},valid:{}};
          for(const [slug,expect] of [['wrongbook-ai','v3-learning-objects-regions'],['wrongbook-sheet-ai','2-learning-objects-regions'],['wrongbook-guide-ai','guide-v2-staged']]){
            const r=await fetch(`${root}/${slug}${slug==='wrongbook-ai'?'/health':''}`);const j=await r.json();backend.health[slug]={status:r.status,body:j};if(!r.ok||JSON.stringify(j).includes(expect)===false){failed=true;console.error('health mismatch',slug,j)}
          }
          const unauth=await fetch(`${root}/wrongbook-guide-ai`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});backend.errors.unauthorized={status:unauth.status,body:await unauth.json()};if(unauth.status!==401)failed=true;
          const missingAi=await fetch(`${root}/wrongbook-ai/analyze`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:'{}'});backend.errors.missingAnalyze={status:missingAi.status,body:await missingAi.json()};if(missingAi.status!==400)failed=true;
          const missingGuide=await fetch(`${root}/wrongbook-guide-ai`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:JSON.stringify({mode:'instructive'})});backend.errors.missingGuide={status:missingGuide.status,body:await missingGuide.json()};if(missingGuide.status!==400)failed=true;
          const malformed=await fetch(`${root}/wrongbook-guide-ai`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:'{bad'});backend.errors.malformed={status:malformed.status,body:await malformed.json()};if(malformed.status!==400)failed=true;

          const fixture=await browser.newPage({viewport:{width:900,height:650}});await fixture.setContent(`<html><body style="font-family:sans-serif;padding:55px;font-size:26px"><b>物理選擇題</b><p>物體在水平面上保持靜止。下列敘述何者正確？</p><p>A. 靜摩擦力一定等於最大靜摩擦力</p><p>B. 靜摩擦力會依維持靜止所需調整</p><p style="color:#2233aa">學生作答：A</p></body></html>`);const png=await fixture.screenshot({type:'png'});await fixture.close();const imageBase64=png.toString('base64');
          const analyze=await fetch(`${root}/wrongbook-ai/analyze`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:JSON.stringify({imageBase64,mimeType:'image/png',syllabus:{level:'高中'}})});const aj=await analyze.json();backend.valid.analyze={status:analyze.status,body:aj};if(!analyze.ok||!['generic_fact','problem_dependent','mixed'].includes(aj?.result?.learningObjectType)||!Array.isArray(aj?.result?.genericFacts)||!Array.isArray(aj?.result?.regions)){failed=true;console.error('analyze contract',aj)}
          const sheet=await fetch(`${root}/wrongbook-sheet-ai`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:JSON.stringify({imageBase64,mimeType:'image/png'})});const sj=await sheet.json();backend.valid.sheet={status:sheet.status,body:sj};if(!sheet.ok||!Array.isArray(sj?.result?.questions)){failed=true;console.error('sheet contract',sj)}
          const guide=await fetch(`${root}/wrongbook-guide-ai`,{method:'POST',headers:{'content-type':'application/json',apikey:key},body:JSON.stringify({problemText:'物體在水平面上保持靜止。A 選項說靜摩擦力一定等於最大靜摩擦力。',studentAnswer:['A'],correctAnswer:['B'],subject:'物理',concepts:[{nameZh:'靜摩擦力'}],mode:'instructive',requestType:'start',question:'請先看我錯在哪裡，再只提示下一步。',regions:[]})});const gj=await guide.json();backend.valid.guide={status:guide.status,body:gj};if(!guide.ok||!gj?.result?.diagnosis||gj?.result?.mode!=='instructive'||gj?.result?.stages?.length!==1||gj.result.stages[0].revealFinalAnswer!==false){failed=true;console.error('guide contract',gj)}
          fs.writeFileSync('.qa-artifacts/wrongbook-v5/backend.json',JSON.stringify(backend,null,2));
          await browser.close();if(failed)process.exit(1);
          EOF
          node .wrongbook-v5-qa.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-v5-rendered-qa
          path: .qa-artifacts/wrongbook-v5
