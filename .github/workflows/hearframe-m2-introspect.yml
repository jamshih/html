name: Hearframe M2 corpus introspection

on:
  push:
    branches: [agent/hearframe-m2]
    paths:
      - '.github/scripts/hearframe-m2-introspect-bank.py'
      - '.github/workflows/hearframe-m2-introspect.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hearframe-m2-introspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hearframe-m2
          fetch-depth: 0
      - name: Inspect bank schema
        run: python .github/scripts/hearframe-m2-introspect-bank.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hearframe-grand-v4/ask/m2-bank-introspection.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Generate Hearframe M2 bank introspection"
          for n in 1 2 3; do
            git fetch origin agent/hearframe-m2
            git rebase origin/agent/hearframe-m2 || { git rebase --abort || true; sleep $((n*2)); continue; }
            git push origin HEAD:agent/hearframe-m2 && exit 0
            sleep $((n*2))
          done
          exit 1
