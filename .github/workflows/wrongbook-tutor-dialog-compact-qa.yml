name: Wrongbook Tutor Dialog Compact QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'wrongbook-v2/tutor-dialog-compact-v20.js'
      - 'wrongbook-v2/native-question-capture-source-align-v1.js'
      - 'wrongbook-v2/qa/tutor-dialog-compact-v20.*'
      - '.github/workflows/wrongbook-tutor-dialog-compact-qa.yml'
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/tutor-dialog-compact-v20.js'
      - 'wrongbook-v2/native-question-capture-source-align-v1.js'
      - 'wrongbook-v2/qa/tutor-dialog-compact-v20.*'
      - '.github/workflows/wrongbook-tutor-dialog-compact-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutor-dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and static contracts
        run: |
          node --check wrongbook-v2/tutor-dialog-compact-v20.js
          node --check wrongbook-v2/native-question-capture-source-align-v1.js
          node wrongbook-v2/qa/tutor-dialog-compact-v20.mjs
      - name: Browser geometry and typography QA
        run: |
          python3 -m http.server 8765 --directory wrongbook-v2 >/tmp/wb-tutor-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          chromium --headless --no-sandbox --disable-gpu --window-size=1200,800 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8765/qa/tutor-dialog-compact-v20.html > /tmp/wb-tutor-dom.html
          cat /tmp/wb-tutor-dom.html
          grep -q 'data-status="PASS"' /tmp/wb-tutor-dom.html
          grep -q '"pass": true' /tmp/wb-tutor-dom.html
