name: Build Ask Hearframe corpus

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/ask-build-trigger.txt'
      - '.github/scripts/build-hearframe-ask.py'

permissions:
  contents: write

jobs:
  build-ask-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media + alignment dependencies
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip
          pip install faster-whisper
      - name: Build aligned corpus and answer videos
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/scripts/build-hearframe-ask.py 2>&1 | tee /tmp/hearframe-ask-build.log
      - name: Save build diagnostics
        if: always()
        run: |
          mkdir -p hearframe-grand-v4/ask
          cp /tmp/hearframe-ask-build.log hearframe-grand-v4/ask/build-log.txt || true
          echo "outcome=${{ steps.build.outcome }}" > hearframe-grand-v4/ask/build-result.txt
          git config user.name 'hearframe-ask-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask
          git commit -m 'Build Ask Hearframe aligned speech corpus [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if corpus build failed
        if: steps.build.outcome != 'success'
        run: exit 1
