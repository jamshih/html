name: Hearframe Gemini Live QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/gemini-live-qa-trigger.txt'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe real Interview AIBot Gemini backend
        id: probe
        continue-on-error: true
        run: node .github/scripts/hearframe-gemini-live-qa.mjs
      - name: Record QA, vocabulary, and upgraded lab
        if: always()
        run: |
          git config user.name 'hearframe-gemini-live-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/gemini-live-qa.json hearframe-grand-v4/ask/corpus-vocabulary.json hearframe-grand-v4/ai-refine.html || true
          git commit -m 'Record Hearframe real-corpus Gemini QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail when live Gemini probe failed
        if: steps.probe.outcome != 'success'
        run: exit 1
