name: Earth Production Q7 Repair

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths: ['.github/workflows/earth-collision-edit-temp.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earth-collision-zero-20260816
          fetch-depth: 0
      - name: Restore verified p242 and apply metadata-only Q7 fix
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git checkout 48ffadd21ae3f05fd9cb782578e3626b830e3e29 -- wrongbook-v2/earth-source-trace-p242-v6.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrongbook-v2/earth-source-trace-p242-v6.js')
          s=p.read_text()
          old='hidden7=\'<span class="v7-logical-question-marker" data-question="7" data-page="242" data-v7-composite-source="true" hidden aria-hidden="true"></span>\''
          new='hidden7=\'<span class="v7-logical-question-marker" data-logical-question="7" data-page="242" data-v7-composite-source="true" hidden aria-hidden="true"></span>\''
          if old not in s: raise SystemExit('verified Q7 marker target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check wrongbook-v2/earth-source-trace-p242-v6.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrongbook-v2/earth-source-trace-p242-v6.js
          git commit -m 'Repair Q7 metadata on verified p242 source'
          git push origin HEAD:main
