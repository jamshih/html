name: Earth Live GitHub Pages Acceptance

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths: ['.github/workflows/earth-collision-edit-temp.yml']

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Traditional Chinese browser font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Verify public deployed bytes and rendered E2E
        run: |
          set -euo pipefail
          BASE='https://jamshih.github.io/html/wrongbook-v2'
          CB="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/earth-source-prompts-v7-242-243.js?cb=$CB" -o /tmp/live-prompts.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/earth-source-trace-p243-v6.js?cb=$CB" -o /tmp/live-p243.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/earth-source-trace-p243-true-v6.css?cb=$CB" -o /tmp/live-p243.css
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/?cb=$CB" -o /tmp/live-index.html

          python3 - <<'PY'
          from pathlib import Path
          m=Path('/tmp/live-prompts.js').read_text()
          r=Path('/tmp/live-p243.js').read_text()
          c=Path('/tmp/live-p243.css').read_text()
          assert "E(48,'<b class=\"v4strict-num\">(48)</b> {{0}}　<b class=\"v4strict-num\">(49)</b> {{1}}',2" in m, 'public manifest missing composite Q48/Q49'
          assert "E(49," not in m, 'public manifest still has standalone Q49'
          assert 'boundaryQ48' in r, 'public renderer missing boundaryQ48 owner'
          assert 'data-question=\\"48\\"' in r or 'data-question=\"48\"' in r, 'public renderer missing canonical Q48 owner'
          assert 'v8-p243-qgroup{display:contents!important}' in c, 'public CSS missing display:contents ownership group'
          print('PUBLIC_BYTES_PASS')
          PY

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          parse_e2e(){ python3 - "$1" <<'PY'
          from pathlib import Path
          import re,html,json,sys
          s=Path(sys.argv[1]).read_text(errors='replace')
          m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',s,re.S)
          if not m: raise SystemExit('missing e2e result: '+sys.argv[1])
          payload=html.unescape(m.group(2));r=json.loads(payload)
          print(sys.argv[1],m.group(1),'manifestCount=',r.get('manifestCount'),'promptQA=',r.get('promptQA'))
          if m.group(1)!='PASS': print(json.dumps(r,ensure_ascii=False,indent=2));raise SystemExit(1)
          PY
          }
          for SPEC in desktop:1440,1000 mobile:390,844; do
            NAME="${SPEC%%:*}";SIZE="${SPEC#*:}"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/live-source-$NAME" --window-size="$SIZE" --virtual-time-budget=12000 \
              --dump-dom "$BASE/?sourcee2e=1&cb=$CB-$NAME" > "/tmp/live-source-$NAME.html"
            parse_e2e "/tmp/live-source-$NAME.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/live-refine-$NAME" --window-size="$SIZE" --virtual-time-budget=14000 \
              --dump-dom "$BASE/?refinee2e=1&cb=$CB-$NAME" > "/tmp/live-refine-$NAME.html"
            parse_e2e "/tmp/live-refine-$NAME.html"
          done

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --user-data-dir=/tmp/live-ch1 --window-size=2200,1600 --virtual-time-budget=10000 \
            --screenshot=/tmp/live-ch1.png "$BASE/?refpreview=1&chapter=1&mode=recall&cb=$CB"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/live-ch1-dom --window-size=2200,1600 --virtual-time-budget=10000 \
            --dump-dom "$BASE/?refpreview=1&chapter=1&mode=recall&cb=$CB-dom" > /tmp/live-ch1.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/live-ch1.html').read_text(errors='replace')
          qs=re.findall(r'\bdata-question="(\d+)"',s)
          assert '49' not in qs, 'live DOM still has standalone canonical Q49'
          assert '48' in qs, 'live DOM missing canonical Q48'
          assert '(49)' in s or '&lpar;49&rpar;' in s or '>49<' in s, 'live DOM missing printed source label 49'
          print('LIVE_CH1_OWNER_PASS',len(qs),sorted(set(qs),key=int))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-live-pages-acceptance
          path: |
            /tmp/live-prompts.js
            /tmp/live-p243.js
            /tmp/live-p243.css
            /tmp/live-source-*.html
            /tmp/live-refine-*.html
            /tmp/live-ch1.html
            /tmp/live-ch1.png
          retention-days: 3
