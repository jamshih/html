name: Earth Collision One-shot Edit

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths: ['.github/workflows/earth-collision-edit-temp.yml']

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earth-collision-zero-20260816
      - name: Apply final source-truth fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('wrongbook-v2')
          def ensure(path, old, new):
              p=root/path; s=p.read_text()
              if new in s: return
              if old not in s: raise SystemExit(f'neither old nor new found in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))
          ensure('earth-source-trace-p245-v6.css','left:420px!important;top:610px!important;width:125px!important','left:455px!important;top:610px!important;width:120px!important')
          ensure('earth-source-trace-p247-v6.js','v6P247Q(ch,mode,32,28,560,180','v6P247Q(ch,mode,32,28,575,180')
          ensure('earth-source-trace-p250-v6.js','6:[385,395,70]','6:[365,395,65]')
          ensure('earth-source-trace-p250-v6.js','9:[445,397,110]','9:[445,405,110]')
          ensure('earth-source-trace-p250-v6.js','13:[565,410,220]','13:[565,410,300]')
          p=root/'earth-source-trace-p253-correct-v6.css'; s=p.read_text()
          if 'NEW_SOURCE_TRUTH final local separation' not in s:
              p.write_text(s+'''\n/* NEW_SOURCE_TRUTH final local separation. */\n.v6-p253-q[data-question="31"]{left:390px!important;top:228px!important;width:220px!important}\n.v6-p253-q[data-question="44"]{left:360px!important;top:930px!important;width:540px!important;font-size:10.8px!important}\n.v6-p253-q[data-question="45"]{left:360px!important;top:975px!important;width:540px!important;font-size:10.8px!important}\n''')
          manifest='earth-source-prompts-v7-252-253.js'
          ensure(manifest,"E(44,'波前進方向往 <b class=\"v4strict-num\">(44)</b> {{0}} 速區偏折 → 浪往海岬匯聚 → 海岬處侵蝕作用較 {{1}}',2,['慢','強'],{replaceFields:true,keepOldAsAliases:false})","E(44,'波前進方向往 <b class=\"v4strict-num\">(44)</b> {{0}} 速區偏折 → 浪往海岬匯聚 → 海岬處侵蝕作用較 {{1}}',2,['慢','強'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[55,55]})")
          ensure(manifest,"E(45,'<b class=\"v4strict-num\">(45)</b> 形成 {{0}}，其流向與突堤效應影響沉積物堆積位置<br>→ 兩沿岸流匯聚會形成 {{1}}，向外海流出',2,['沿岸流','離岸流'],{replaceFields:true,keepOldAsAliases:false})","E(45,'<b class=\"v4strict-num\">(45)</b> 形成 {{0}}，其流向與突堤效應影響沉積物堆積位置<br>→ 兩沿岸流匯聚會形成 {{1}}，向外海流出',2,['沿岸流','離岸流'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[58,58]})")
          ensure(manifest,"E(49,'大潮：日地月成一線（月相：<b class=\"v4strict-num\">(49)</b> {{0}} 與 {{1}}），當日滿潮水位較 {{2}}，乾潮水位較 {{3}}，潮差較 {{4}}',5,['朔','望','高','低','大'],{replaceFields:true,keepOldAsAliases:false})","E(49,'大潮：日地月成一線（月相：<b class=\"v4strict-num\">(49)</b> {{0}} 與 {{1}}），當日滿潮水位較 {{2}}，乾潮水位較 {{3}}，潮差較 {{4}}',5,['朔','望','高','低','大'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[48,48,48,48,48]})")
          ensure(manifest,"E(50,'小潮：日地月成90度（月相：<b class=\"v4strict-num\">(50)</b> {{0}} 與 {{1}}），當日潮差較 {{2}}',3,['上弦','下弦','小'],{replaceFields:true,keepOldAsAliases:false})","E(50,'小潮：日地月成90度（月相：<b class=\"v4strict-num\">(50)</b> {{0}} 與 {{1}}），當日潮差較 {{2}}',3,['上弦','下弦','小'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[52,52,52]})")
          PY
          node --check wrongbook-v2/earth-source-trace-p247-v6.js
          node --check wrongbook-v2/earth-source-trace-p250-v6.js
          node --check wrongbook-v2/earth-source-prompts-v7-252-253.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrongbook-v2/earth-source-trace-p245-v6.css wrongbook-v2/earth-source-trace-p247-v6.js wrongbook-v2/earth-source-trace-p250-v6.js wrongbook-v2/earth-source-trace-p253-correct-v6.css wrongbook-v2/earth-source-prompts-v7-252-253.js
          git diff --cached --check
          git commit -m 'Clear final local Earth collisions'
          git push origin HEAD:earth-collision-zero-20260816
