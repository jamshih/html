name: Earth Collision One-shot Edit

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths:
      - '.github/workflows/earth-collision-edit-temp.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earth-collision-zero-20260816
      - name: Apply remaining-page source-truth collision batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('wrongbook-v2')
          def rep(path, old, new):
              p=root/path; s=p.read_text()
              if old not in s: raise SystemExit(f'missing target in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          # p245 — separate the galaxy-hierarchy row.
          rep('earth-source-trace-p245-v6.css','left:420px!important;top:610px!important;width:190px!important','left:420px!important;top:610px!important;width:130px!important')
          rep('earth-source-trace-p245-v6.css','left:560px!important;top:610px!important;width:170px!important','left:570px!important;top:610px!important;width:150px!important')

          # p247 — move the lower solar-position anchors below the long source prompts above them.
          rep('earth-source-trace-p247-v6.js','v6P247Q(ch,mode,27,68,475,340','v6P247Q(ch,mode,27,68,520,340')
          rep('earth-source-trace-p247-v6.js','v6P247Q(ch,mode,28,630,535,120','v6P247Q(ch,mode,28,630,570,120')
          rep('earth-source-trace-p247-v6.js','v6P247Q(ch,mode,29,755,500,120','v6P247Q(ch,mode,29,755,570,120')

          # p249 — retain the textbook's source grouping while separating evidence/instruction rows.
          rep('earth-source-trace-p249-v6.js','v6P249Q(ch,22,95,685,300','v6P249Q(ch,22,95,735,300')
          rep('earth-source-trace-p249-v6.js','v6P249Q(ch,24,730,654,145','v6P249Q(ch,24,720,735,160')
          rep('earth-source-refine-figure-blanks-v7.js','left:4px;top:0;width:300px;font-size:13px','left:4px;top:-28px;width:300px;font-size:13px')

          # p250 — source-grid coordinates for the complete upper atmosphere block, not isolated nudges.
          p=root/'earth-source-trace-p250-v6.js'; s=p.read_text()
          start=s.index('const P250_POS='); end=s.index(';\nconst P250_TXT',start)
          newpos="const P250_POS={1:[290,282,140],2:[55,365,90],3:[55,515,90],4:[80,565,230],5:[145,405,190],6:[385,395,70],7:[145,475,190],8:[440,360,160],9:[445,397,110],10:[445,445,110],11:[445,497,110],12:[445,550,110],13:[565,410,220],14:[565,455,220],15:[565,505,220],16:[565,550,220],17:[565,600,220],48:[500,690,310],49:[500,730,310],50:[500,780,310],51:[610,860,230],52:[600,920,150],53:[600,970,150],54:[615,1025,220],55:[80,1030,260],56:[80,1090,320],57:[80,1160,300],58:[590,1095,230],59:[590,1150,230],60:[560,1205,275]}"
          p.write_text(s[:start]+newpos+s[end:])

          # p251 — consecutive ENSO prompts each get a source row.
          rep('earth-source-trace-p251-v6.js','39:[500,965,340]','39:[500,990,340]')

          # p253 — the bottom half is printed densely in the source; use its full horizontal bands.
          p=root/'earth-source-trace-p253-correct-v6.css'; s=p.read_text()
          block='''\n/* NEW_SOURCE_TRUTH second collision pass: source-row density and disjoint active-recall fields. */\n.v6-p253-q[data-question="28"]{top:185px!important}\n.v6-p253-q[data-question="34"]{top:365px!important}\n.v6-p253-q[data-question="43"],.v6-p253-q[data-question="44"],.v6-p253-q[data-question="45"],.v6-p253-q[data-question="46"],.v6-p253-q[data-question="47"],.v6-p253-q[data-question="48"],.v6-p253-q[data-question="49"],.v6-p253-q[data-question="50"]{font-size:11.3px!important;line-height:1.16!important}\n.v6-p253-q[data-question="43"]{left:410px!important;top:890px!important;width:470px!important}\n.v6-p253-q[data-question="44"]{left:410px!important;top:930px!important;width:470px!important}\n.v6-p253-q[data-question="45"]{left:400px!important;top:970px!important;width:500px!important}\n.v6-p253-q[data-question="46"]{left:280px!important;top:1035px!important;width:600px!important}\n.v6-p253-q[data-question="47"]{left:280px!important;top:1080px!important;width:600px!important}\n.v6-p253-q[data-question="48"]{left:180px!important;top:1120px!important;width:680px!important}\n.v6-p253-q[data-question="49"]{left:180px!important;top:1155px!important;width:700px!important}\n.v6-p253-q[data-question="50"]{left:180px!important;top:1210px!important;width:700px!important}\n'''
          if 'NEW_SOURCE_TRUTH second collision pass' in s: raise SystemExit('p253 second pass already present')
          p.write_text(s+block)
          PY
          node --check wrongbook-v2/earth-source-trace-p247-v6.js
          node --check wrongbook-v2/earth-source-trace-p249-v6.js
          node --check wrongbook-v2/earth-source-trace-p250-v6.js
          node --check wrongbook-v2/earth-source-trace-p251-v6.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrongbook-v2/earth-source-trace-p245-v6.css wrongbook-v2/earth-source-trace-p247-v6.js wrongbook-v2/earth-source-trace-p249-v6.js wrongbook-v2/earth-source-refine-figure-blanks-v7.js wrongbook-v2/earth-source-trace-p250-v6.js wrongbook-v2/earth-source-trace-p251-v6.js wrongbook-v2/earth-source-trace-p253-correct-v6.css
          git diff --cached --check
          git commit -m 'Clear remaining second-pass Earth collisions'
          git push origin HEAD:earth-collision-zero-20260816
