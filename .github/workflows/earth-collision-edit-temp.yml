name: Earth Collision One-shot Edit

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths: ['.github/workflows/earth-collision-edit-temp.yml']

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earth-collision-zero-20260816
      - name: Encode source Q49 two-row prompt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrongbook-v2/earth-source-prompts-v7-252-253.js')
          s=p.read_text()
          old="E(49,'大潮：日地月成一線（月相：<b class=\"v4strict-num\">(49)</b> {{0}} 與 {{1}}），當日滿潮水位較 {{2}}，乾潮水位較 {{3}}，潮差較 {{4}}',5,['朔','望','高','低','大'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[48,48,48,48,48]})"
          new="E(49,'大潮：日地月成一線（月相：<b class=\"v4strict-num\">(49)</b> {{0}} 與 {{1}}），當日滿潮水位較 {{2}}，<br>乾潮水位較 {{3}}，潮差較 {{4}}',5,['朔','望','高','低','大'],{replaceFields:true,keepOldAsAliases:false,blankWidths:[48,48,48,48,48]})"
          if new not in s:
              if old not in s: raise SystemExit('q49 source row not found')
              p.write_text(s.replace(old,new,1))
          PY
          node --check wrongbook-v2/earth-source-prompts-v7-252-253.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrongbook-v2/earth-source-prompts-v7-252-253.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Match p253 Q49 photographed line break'
          git push origin HEAD:earth-collision-zero-20260816
