name: Earth Collision One-shot Edit

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths:
      - '.github/workflows/earth-collision-edit-temp.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earth-collision-zero-20260816
      - name: Apply p244 source-truth collision correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('wrongbook-v2')
          def rep(path, old, new):
              p=root/path; s=p.read_text()
              if old not in s: raise SystemExit(f'missing target in {path}: {old[:120]}')
              p.write_text(s.replace(old,new,1))

          # Exact prompt wording and geometry stay synchronized.
          manifest='earth-source-prompts-v7-244-245.js'
          for old,new in {
            "sourceRect:R(397,488,225,36)":"sourceRect:R(397,500,225,32)",
            "sourceRect:R(344,385,112,30)":"sourceRect:R(344,382,112,28)",
            "sourceRect:R(418,416,136,42)":"sourceRect:R(420,435,136,42)",
            "sourceRect:R(558,438,310,52)":"sourceRect:R(558,430,325,50)",
            "sourceRect:R(385,928,400,55)":"sourceRect:R(385,938,400,55)",
            "sourceRect:R(385,990,400,48)":"sourceRect:R(385,1000,400,48)",
            "sourceRect:R(385,1042,155,30)":"sourceRect:R(385,1052,155,30)",
            "sourceRect:R(555,1045,120,26)":"sourceRect:R(555,1055,120,26)"
          }.items(): rep(manifest,old,new)

          layout='earth-source-trace-p244-v6.js'
          for old,new in {
            "colorExamples:{role:'figure',rect:R(30,386,190,82),safeRect:R(30,386,190,82)}":"colorExamples:{role:'figure',rect:R(30,400,190,68),safeRect:R(30,400,190,68)}",
            "planetLabel:{role:'source-label',rect:R(55,545,80,25)}":"planetLabel:{role:'source-label',rect:R(55,520,70,25)}",
            "starLabel:{role:'source-label',rect:R(145,550,80,25)}":"starLabel:{role:'source-label',rect:R(145,520,70,25)}",
            "astronaut:{role:'figure',rect:R(14,560,130,125),safeRect:R(14,560,130,125)}":"astronaut:{role:'figure',rect:R(14,570,100,120),safeRect:R(14,570,100,120)}",
            "starNode:{role:'figure',rect:R(92,572,88,92),safeRect:R(92,572,88,92)}":"starNode:{role:'figure',rect:R(115,568,80,90),safeRect:R(115,568,80,90)}",
            "zodiacCopy:{role:'source-label',rect:R(55,838,255,72)}":"zodiacCopy:{role:'source-label',rect:R(55,870,255,68)}",
            "distanceBox:{role:'figure',rect:R(370,900,455,245),safeRect:R(370,900,455,245)":"distanceBox:{role:'figure',rect:R(370,910,455,245),safeRect:R(370,910,455,245)",
            "distanceTitle:{role:'source-label',rect:R(382,904,205,24),inside:'distanceBox',localRect:R(12,4,205,24)}":"distanceTitle:{role:'source-label',rect:R(382,914,205,24),inside:'distanceBox',localRect:R(12,4,205,24)}",
            "parallaxTriangle:{role:'figure',rect:R(500,1074,158,48),inside:'distanceBox',localRect:R(130,174,158,48),safeRect:R(500,1074,158,48)}":"parallaxTriangle:{role:'figure',rect:R(500,1084,158,40),inside:'distanceBox',localRect:R(130,174,158,40),safeRect:R(500,1084,158,40)}",
            "distanceUse:{role:'source-label',rect:R(382,1118,390,23),inside:'distanceBox',localRect:R(12,218,390,23)}":"distanceUse:{role:'source-label',rect:R(382,1132,390,20),inside:'distanceBox',localRect:R(12,222,390,20)}",
            "color2ToStar:{path:'M300 360L165 570'":"color2ToStar:{path:'M300 372L175 568'",
            "q7ToBright:{path:'M398 416L337 548'":"q7ToBright:{path:'M344 414L238 445L238 540L278 568'",
            "q6ToBright:{path:'M397 518L360 553'":"q6ToBright:{path:'M397 532L397 548L360 560'"
          }.items(): rep(layout,old,new)

          css='earth-source-trace-p244-v6.css'
          rep(css,'.v8-p244-page .v8-p244-q[data-question="14"]{font-size:13.4px!important}', '.v8-p244-page .v8-p244-q[data-question="14"]{font-size:12.8px!important;line-height:1.25!important}')
          rep(css,'.v8-p244-page .v8-p244-q[data-question="11"],.v8-p244-page .v8-p244-q[data-question="12"],.v8-p244-page .v8-p244-q[data-question="13"],.v8-p244-page .v8-p244-q[data-question="16"],.v8-p244-page .v8-p244-q[data-question="17"]{white-space:nowrap!important}', '.v8-p244-page .v8-p244-q[data-question="6"],.v8-p244-page .v8-p244-q[data-question="7"],.v8-p244-page .v8-p244-q[data-question="11"],.v8-p244-page .v8-p244-q[data-question="12"],.v8-p244-page .v8-p244-q[data-question="13"],.v8-p244-page .v8-p244-q[data-question="16"],.v8-p244-page .v8-p244-q[data-question="17"]{white-space:nowrap!important}')
          PY
          node --check wrongbook-v2/earth-source-trace-p244-v6.js
          node --check wrongbook-v2/earth-source-prompts-v7-244-245.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrongbook-v2/earth-source-trace-p244-v6.js wrongbook-v2/earth-source-trace-p244-v6.css wrongbook-v2/earth-source-prompts-v7-244-245.js
          git diff --cached --check
          git commit -m 'Clear p244 source-owned collisions'
          git push origin HEAD:earth-collision-zero-20260816
