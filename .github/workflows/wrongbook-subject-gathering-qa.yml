name: Wrongbook Subject Gathering QA

on:
  pull_request:
    paths:
      - 'wrongbook-v2/mindmap-root-subject-nav-v1.js'
      - 'wrongbook-v2/mindmap-root-subject-nav-v1.css'
      - 'wrongbook-v2/mindmap-subject-nav-v1.js'
      - 'wrongbook-v2/qa/mindmap-subject-gathering-v2-playwright.js'
      - '.github/workflows/wrongbook-subject-gathering-qa.yml'

permissions:
  contents: read

jobs:
  subject-gathering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check wrongbook-v2/mindmap-root-subject-nav-v1.js
          node --check wrongbook-v2/mindmap-subject-nav-v1.js
          node --check wrongbook-v2/qa/mindmap-subject-gathering-v2-playwright.js
      - name: Install Playwright core
        run: |
          mkdir -p /tmp/wb-pw
          cd /tmp/wb-pw
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 --no-save
          ln -s /tmp/wb-pw/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Real Chromium subject gathering regression
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          WB_QA_URL: http://127.0.0.1:8765/wrongbook-v2/index.html
        run: |
          set -o pipefail
          python3 -m http.server 8765 --directory . >/tmp/wb-subject-gathering-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          node wrongbook-v2/qa/mindmap-subject-gathering-v2-playwright.js | tee /tmp/wb-subject-gathering-result.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-subject-gathering-qa
          path: |
            /tmp/wb-subject-gathering-result.json
            /tmp/wb-subject-gathering-http.log
            /tmp/wrongbook-subject-gathering-chemistry.png
            /tmp/wrongbook-subject-gathering-biology.png
            /tmp/wrongbook-subject-gathering-mobile.png
          if-no-files-found: warn
