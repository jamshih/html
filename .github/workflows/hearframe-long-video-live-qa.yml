name: Hearframe Long Video Live QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/ai-long-live-qa-trigger.txt'

permissions:
  contents: write

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run public long-video QA
        id: qa
        continue-on-error: true
        run: node .github/scripts/hearframe-long-video-live-qa.mjs
      - name: Record QA result
        if: always()
        run: |
          git config user.name 'hearframe-long-video-live-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ai-long-live-qa.json || true
          git commit -m 'Record Hearframe long-video live QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
