name: Earth Canonical + Collision Final Gate

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/earth-collision-qa-temp.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check wrongbook-v2/earth-source-prompts-v7-242-243.js
          node --check wrongbook-v2/earth-source-trace-p243-v6.js
          node --check wrongbook-v2/earth-source-integrity-v8.js
          node --check wrongbook-v2/earth-collision-qa-v8.js
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Render and verify all acceptance gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrongbook-v2/index.html');s=p.read_text()
          inject='''<script>if(new URLSearchParams(location.search).has('integrityqa'))setTimeout(()=>{const p=document.createElement('pre');p.id='integrity-results';const r=window.v8EarthSourceIntegrity?.();p.dataset.status=r?.ok?'PASS':'FAIL';p.textContent=JSON.stringify(r||{error:'missing integrity function'},null,2);document.body.appendChild(p)},1800)</script>'''
          Path('wrongbook-v2/integrity-harness.html').write_text(s.replace('</body>',inject+'</body>'))
          PY
          python3 -m http.server 4173 >/tmp/earth-final-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME"

          # 12-page collision gate and six fresh spread screenshots.
          for CH in 1 2 3 4 5 6; do
            BASE="http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --user-data-dir="/tmp/final-shot-${CH}" --window-size=2200,1600 --virtual-time-budget=7000 --screenshot="/tmp/final-ch${CH}.png" "$BASE"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/final-collision-${CH}" --window-size=2200,1600 --virtual-time-budget=9000 --dump-dom "${BASE}&collisionqa=1" > "/tmp/final-collision-${CH}.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          pages=[]
          for ch in range(1,7):
              s=Path(f'/tmp/final-collision-{ch}.html').read_text(errors='replace')
              m=re.search(r'<pre id="earth-collision-results"[^>]*>(.*?)</pre>',s,re.S)
              if not m: raise SystemExit(f'collision report missing ch{ch}')
              r=json.loads(html.unescape(re.sub('<[^>]+>','',m.group(1))))
              pages += [p for p in r['pages'] if p['status']!='NOT_RENDERED']
          by={p['page']:p for p in pages}; ordered=[by[p] for p in range(242,254) if p in by]
          out={'renderedPages':len(ordered),'totalUnwantedCollisions':sum(len(p.get('collisions',[])) for p in ordered),'connectorTextIntersections':sum(p.get('connectorTextIntersections',0) for p in ordered),'connectorFigureIntersections':sum(p.get('connectorFigureIntersections',0) for p in ordered),'pages':[(p['page'],p['status'],len(p.get('collisions',[]))) for p in ordered]}
          Path('/tmp/final-collision.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False,indent=2))
          if len(ordered)!=12 or any(p['status']!='PASS' for p in ordered) or out['totalUnwantedCollisions'] or out['connectorTextIntersections'] or out['connectorFigureIntersections']: raise SystemExit('collision gate failed')
          PY

          parse_e2e() { python3 - "$1" <<'PY'
          from pathlib import Path
          import html,re,sys,json
          s=Path(sys.argv[1]).read_text(errors='replace');m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',s,re.S)
          if not m: raise SystemExit('E2E result missing '+sys.argv[1])
          payload=html.unescape(m.group(2));r=json.loads(payload);print(json.dumps({'status':r.get('status'),'manifestCount':r.get('manifestCount'),'promptQA':r.get('promptQA')},ensure_ascii=False))
          if m.group(1)!='PASS': print(payload);raise SystemExit(1)
          PY
          }
          for SPEC in desktop:1440,1000 mobile:390,844; do
            NAME="${SPEC%%:*}";SIZE="${SPEC#*:}"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/source-${NAME}" --window-size="$SIZE" --virtual-time-budget=9000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?sourcee2e=1" > "/tmp/source-${NAME}.html"
            parse_e2e "/tmp/source-${NAME}.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/refine-${NAME}" --window-size="$SIZE" --virtual-time-budget=11000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?refinee2e=1" > "/tmp/refine-${NAME}.html"
            parse_e2e "/tmp/refine-${NAME}.html"
          done

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/integrity --window-size=1440,1000 --virtual-time-budget=8000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/integrity-harness.html?integrityqa=1" > /tmp/integrity.html
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          s=Path('/tmp/integrity.html').read_text(errors='replace');m=re.search(r'<pre id="integrity-results" data-status="([^"]+)">(.*?)</pre>',s,re.S)
          if not m: raise SystemExit('integrity result missing')
          r=json.loads(html.unescape(re.sub('<[^>]+>','',m.group(2))))
          keys=['ok','expectedQuestions','canonicalQuestionCount','uniqueQuestionCount','registeredQuestionCount','registeredUniqueQuestionCount','printedBlankLabelCount','expectedFigures','actualFigures','missingQuestionIds','duplicateQuestionIds','orphanQuestionIds','pageMismatchQuestionIds','missingFigures','orphanFigures','ch5OrderOk']
          out={k:r.get(k) for k in keys};Path('/tmp/integrity.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False,indent=2))
          if m.group(1)!='PASS' or not r.get('ok') or r.get('canonicalQuestionCount')!=276 or r.get('registeredQuestionCount')!=276 or r.get('actualFigures')!=56: raise SystemExit('integrity gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-final-acceptance
          path: |
            /tmp/final-ch*.png
            /tmp/final-collision.json
            /tmp/source-*.html
            /tmp/refine-*.html
            /tmp/integrity.html
            /tmp/integrity.json
          retention-days: 3
