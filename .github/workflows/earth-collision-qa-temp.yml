name: Earth Collision QA Workspace

# QA retrigger: final local all-pages measurement.
on:
  push:
    branches: [earth-collision-zero-20260816]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/earth-collision-qa-temp.yml'

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax guard
        run: |
          node --check wrongbook-v2/earth-source-trace-p242-v6.js
          node --check wrongbook-v2/earth-source-trace-p243-v6.js
          node --check wrongbook-v2/earth-source-trace-p244-v6.js
          node --check wrongbook-v2/earth-source-prompt-renderer-v7.js
          node --check wrongbook-v2/earth-collision-qa-v8.js
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Capture all Earth spreads and collision QA
        run: |
          tar -czf /tmp/wrongbook-main-source.tgz wrongbook-v2
          python3 -m http.server 4173 >/tmp/earth-collision-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for CH in 1 2 3 4 5 6; do
            BASE="http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/earth-shot-${CH}" --window-size=2200,1600 --virtual-time-budget=7000 \
              --screenshot="/tmp/earth-collision-ch${CH}.png" "$BASE"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir="/tmp/earth-qa-${CH}" --window-size=2200,1600 --virtual-time-budget=9000 \
              --dump-dom "${BASE}&collisionqa=1" > "/tmp/earth-collision-qa-ch${CH}.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/earth-debug-${CH}" --window-size=2200,1600 --virtual-time-budget=9000 \
              --screenshot="/tmp/earth-collision-debug-ch${CH}.png" "${BASE}&collisiondebug=1"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          all_pages=[]
          for ch in range(1,7):
              s=Path(f'/tmp/earth-collision-qa-ch{ch}.html').read_text(errors='ignore')
              m=re.search(r'<pre id="earth-collision-results"[^>]*>(.*?)</pre>',s,re.S)
              if not m: raise SystemExit(f'missing earth-collision-results for chapter {ch}')
              report=json.loads(html.unescape(re.sub('<[^>]+>','',m.group(1))))
              rendered=[p for p in report['pages'] if p['status']!='NOT_RENDERED']
              Path(f'/tmp/earth-collision-report-ch{ch}.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2))
              all_pages.extend(rendered)
          by_page={p['page']:p for p in all_pages}
          pages=[by_page[p] for p in range(242,254) if p in by_page]
          final={'pages':pages,'renderedPages':len(pages),'totalUnwantedCollisions':sum(len(p.get('collisions',[])) for p in pages),'connectorTextIntersections':sum(p.get('connectorTextIntersections',0) for p in pages),'connectorFigureIntersections':sum(p.get('connectorFigureIntersections',0) for p in pages),'ok':len(pages)==12 and all(p['status']=='PASS' for p in pages)}
          Path('/tmp/earth-collision-report.json').write_text(json.dumps(final,ensure_ascii=False,indent=2))
          print(json.dumps({'pages':[(p['page'],p['status'],len(p.get('collisions',[]))) for p in pages],**{k:final[k] for k in ['renderedPages','totalUnwantedCollisions','connectorTextIntersections','connectorFigureIntersections','ok']}},ensure_ascii=False,indent=2))
          if not final['ok']: raise SystemExit('12-page Earth collision gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-collision-workspace
          path: |
            /tmp/earth-collision-ch*.png
            /tmp/earth-collision-debug-ch*.png
            /tmp/earth-collision-qa-ch*.html
            /tmp/earth-collision-report*.json
            /tmp/wrongbook-main-source.tgz
          retention-days: 3
