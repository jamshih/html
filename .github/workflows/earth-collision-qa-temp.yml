name: Earth Collision QA Workspace

on:
  push:
    branches: [earth-collision-zero-20260816]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/earth-collision-qa-temp.yml'

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax guard
        run: |
          node --check wrongbook-v2/earth-source-trace-p242-v6.js
          node --check wrongbook-v2/earth-source-prompt-renderer-v7.js
          node --check wrongbook-v2/earth-collision-qa-v8.js
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Capture current Earth spreads and collision QA
        run: |
          python3 -m http.server 4173 >/tmp/earth-collision-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for CH in 1 2 3 4 5 6; do
            URL="http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/earth-collision-shot-${CH}" --window-size=2200,1600 --virtual-time-budget=6000 \
              --screenshot="/tmp/earth-collision-ch${CH}.png" "$URL"
          done
          QA='http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=1&mode=recall&collisionqa=1'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/earth-collision-qa --window-size=2200,1600 --virtual-time-budget=9000 \
            --dump-dom "$QA" > /tmp/earth-collision-qa.html
          DEBUG='http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=1&mode=recall&collisiondebug=1'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --user-data-dir=/tmp/earth-collision-debug --window-size=2200,1600 --virtual-time-budget=9000 \
            --screenshot=/tmp/earth-collision-debug-ch1.png "$DEBUG"
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          s=Path('/tmp/earth-collision-qa.html').read_text(errors='ignore')
          m=re.search(r'<pre id="earth-collision-results"[^>]*>(.*?)</pre>',s,re.S)
          if not m: raise SystemExit('missing earth-collision-results')
          report=json.loads(html.unescape(re.sub('<[^>]+>','',m.group(1))))
          p242=next((x for x in report['pages'] if x['page']==242),None)
          Path('/tmp/earth-collision-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          Path('/tmp/p242-collision-report.json').write_text(json.dumps(p242,ensure_ascii=False,indent=2))
          print(json.dumps(p242,ensure_ascii=False,indent=2))
          if not p242 or p242['status']!='PASS': raise SystemExit('page 242 collision gate failed')
          PY
          tar -czf /tmp/wrongbook-main-source.tgz wrongbook-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-collision-workspace
          path: |
            /tmp/earth-collision-ch*.png
            /tmp/earth-collision-debug-ch1.png
            /tmp/earth-collision-qa.html
            /tmp/earth-collision-report.json
            /tmp/p242-collision-report.json
            /tmp/wrongbook-main-source.tgz
          retention-days: 3
