name: Build Hearframe Phrase Sentence Index

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/chunk-index-v2-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build phrase/sentence candidates from forced-aligned words
        run: python .github/scripts/build-hearframe-chunk-index-v2.py
      - name: Commit chunk index and QA report
        run: |
          git config user.name 'hearframe-chunk-index'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-chunk-index-v2.json hearframe-grand-v4/ask/reference-chunk-index-v2-report.json
          git commit -m 'Add phrase and sentence retrieval index [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
