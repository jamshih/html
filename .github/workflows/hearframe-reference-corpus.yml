name: Build Hearframe Reference Corpus

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/reference-build-trigger.txt'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover and preflight 100 reference videos
        run: python .github/scripts/discover-hearframe-references.py
      - name: Commit verified reference catalog
        run: |
          git config user.name 'hearframe-corpus-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-videos.json hearframe-grand-v4/ask/reference-video-report.json
          git commit -m 'Add 100 verified Hearframe reference videos [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
