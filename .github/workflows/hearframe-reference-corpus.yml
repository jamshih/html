name: Build Hearframe Reference Corpus

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/reference-build-trigger.txt'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover and preflight 100 reference videos
        id: discover
        continue-on-error: true
        run: python .github/scripts/discover-hearframe-references.py > hearframe-grand-v4/ask/reference-build.log 2>&1
      - name: Record reference corpus result
        if: always()
        run: |
          echo "outcome=${{ steps.discover.outcome }}" > hearframe-grand-v4/ask/reference-build-result.txt
          git config user.name 'hearframe-corpus-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-videos.json hearframe-grand-v4/ask/reference-video-report.json hearframe-grand-v4/ask/reference-build.log hearframe-grand-v4/ask/reference-build-result.txt || true
          git commit -m 'Record Hearframe reference corpus build [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if discovery failed
        if: steps.discover.outcome != 'success'
        run: exit 1
