name: Earth Source Atlas Branch QA

on:
  push:
    branches: [earth-source-atlas-p244-253-20260816]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/earth-p244-qa-temp.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in wrongbook-v2/*.js; do node --check "$f"; done
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Render all Earth spreads and run source QA
        run: |
          python3 -m http.server 4173 >/tmp/earth-atlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/earth-atlas-final
          for CH in 1 2 3 4 5 6; do
            URL="http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --user-data-dir="/tmp/earth-atlas-shot-${CH}" --window-size=2200,1600 --virtual-time-budget=6500 \
              --screenshot="/tmp/earth-atlas-final/ch${CH}.png" "$URL"
          done
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/earth-atlas-qa --window-size=2200,1600 --virtual-time-budget=8000 \
            --dump-dom 'http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=2&mode=recall&refinee2e=1' > /tmp/earth-atlas-final/refinement.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/earth-atlas-final/refinement.html').read_text(errors='ignore')
          m=re.search(r'<pre id="e2e-results"[^>]*data-status="([^"]+)"[^>]*>(.*?)</pre>',s,re.S)
          if not m:
              raise SystemExit('missing e2e-results')
          status=m.group(1)
          result=html.unescape(re.sub('<[^>]+>','',m.group(2)))
          Path('/tmp/earth-atlas-final/refinement-result.txt').write_text(result)
          print('refinement status',status)
          if status!='PASS':
              raise SystemExit('source refinement QA failed')
          if '"total": 276' not in result or '"passed": 276' not in result:
              raise SystemExit('276/276 source prompt gate missing')
          PY
          git rev-parse HEAD > /tmp/earth-atlas-final/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-source-atlas-final-qa
          path: /tmp/earth-atlas-final
          retention-days: 3
