name: Earth P244 Branch QA

on:
  push:
    branches: [earth-source-atlas-p244-253-20260816]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/earth-p244-qa-temp.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check page renderer
        run: |
          node --check wrongbook-v2/earth-source-trace-p244-v6.js
          node --check wrongbook-v2/earth-source-refine-p244-v7.js
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Render chapter 2 and source-refinement QA
        run: |
          python3 -m http.server 4173 >/tmp/p244-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          URL='http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=2&mode=recall'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --user-data-dir=/tmp/p244-shot --window-size=2200,1600 --virtual-time-budget=6000 \
            --screenshot=/tmp/p244-ch2.png "$URL"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/p244-qa --window-size=2200,1600 --virtual-time-budget=7000 \
            --dump-dom 'http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=2&mode=recall&refinee2e=1' > /tmp/p244-qa.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/p244-qa.html').read_text(errors='ignore')
          m=re.search(r'<pre id="e2e-results"[^>]*data-status="([^"]+)"[^>]*>(.*?)</pre>',s,re.S)
          if not m:
              raise SystemExit('missing e2e-results')
          status=m.group(1)
          Path('/tmp/p244-qa-result.txt').write_text(html.unescape(re.sub('<[^>]+>','',m.group(2))))
          print('refinement status',status)
          if status!='PASS':
              raise SystemExit('source refinement QA failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-p244-qa
          path: |
            /tmp/p244-ch2.png
            /tmp/p244-qa-result.txt
            /tmp/p244-qa.html
          retention-days: 3
