name: Hearframe Milestone 2 build

on:
  push:
    branches: [agent/hearframe-m2]
    paths:
      - '.github/scripts/hearframe-m2-build.py'
      - 'hearframe-grand-v4/ask/m2-curated-sources.json'
      - '.github/workflows/hearframe-m2-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hearframe-m2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hearframe-m2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media + alignment stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'whisperx>=3.3,<4' 'opencv-python-headless>=4.10,<5' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'numpy<3'
          python - <<'PY'
          import importlib.metadata as m
          for p in ['whisperx','opencv-python-headless','scikit-learn','numpy']:
              print(p, m.version(p))
          PY
      - uses: actions/cache@v4
        with:
          path: .hearframe-m2-cache
          key: hearframe-m2-media-v2-${{ hashFiles('hearframe-grand-v4/ask/m2-curated-sources.json') }}
      - name: Build corpus, retrieve story, render and QA
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/scripts/hearframe-m2-build.py 2>&1 | tee hearframe-grand-v4/ask/m2-build.log
      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearframe-m2-inspection
          if-no-files-found: warn
          retention-days: 7
          path: |
            hearframe-grand-v4/ask/m2-curated-contact-sheet.jpg
            hearframe-grand-v4/ask/m2-curated-visual-audit.json
            hearframe-grand-v4/ask/m2-story-plan.json
            hearframe-grand-v4/ask/m2-alignment-report.json
            hearframe-grand-v4/ask/m2-build-report.json
            hearframe-grand-v4/ask/m2-build.log
            hearframe-grand-v4/production-v2.mp4
            hearframe-grand-v4/production-v2-manifest.json
            hearframe-grand-v4/production-v2-qa.json
      - name: Commit generated evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hearframe-m2-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            hearframe-grand-v4/ask/m2-curated-contact-sheet.jpg \
            hearframe-grand-v4/ask/m2-curated-visual-audit.json \
            hearframe-grand-v4/ask/m2-story-plan.json \
            hearframe-grand-v4/ask/m2-alignment-report.json \
            hearframe-grand-v4/ask/m2-thought-inventory.json \
            hearframe-grand-v4/ask/m2-corpus-report.json \
            hearframe-grand-v4/ask/m2-build-report.json \
            hearframe-grand-v4/ask/m2-build.log \
            hearframe-grand-v4/production-v2.mp4 \
            hearframe-grand-v4/production-v2-manifest.json \
            hearframe-grand-v4/production-v2-qa.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Hearframe Milestone 2 candidate [skip ci]'
          for n in 1 2 3 4; do
            git fetch origin agent/hearframe-m2
            git rebase origin/agent/hearframe-m2 || { git rebase --abort || true; sleep $((n*2)); continue; }
            git push origin HEAD:agent/hearframe-m2 && exit 0
            sleep $((n*2))
          done
          exit 1
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
