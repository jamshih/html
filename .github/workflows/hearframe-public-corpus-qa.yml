name: Hearframe Public Corpus QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/public-corpus-qa-trigger.txt'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed corpus lab
        id: qa
        continue-on-error: true
        run: node .github/scripts/hearframe-public-corpus-qa.mjs
      - name: Record result
        if: always()
        run: |
          git config user.name 'hearframe-public-corpus-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/public-corpus-qa.json || true
          git commit -m 'Record public Hearframe corpus QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if public QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
