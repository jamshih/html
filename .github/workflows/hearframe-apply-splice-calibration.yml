name: Apply Hearframe Splice Calibration

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/apply-splice-calibration-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calibrated clip windows to reference word index
        run: python .github/scripts/apply-hearframe-splice-calibration.py
      - name: Commit calibrated reference index
        run: |
          git config user.name 'hearframe-splice-index'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-word-index.json hearframe-grand-v4/ask/reference-index-report.json
          git commit -m 'Apply calibrated splice windows to Hearframe index [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
