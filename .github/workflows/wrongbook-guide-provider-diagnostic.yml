name: Wrongbook guide provider diagnostic
on:
  push:
    branches:
      - agent/wrongbook-concepts-tutor-v5-20260814
    paths:
      - '.github/scripts/wrongbook-guide-provider-diagnostic.mjs'
      - '.github/workflows/wrongbook-guide-provider-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/wrongbook-guide-provider-diagnostic.mjs
