name: Hearframe rendered live QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/rendered-qa-trigger.txt'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Test public rendered route
        id: qa
        continue-on-error: true
        run: node .github/scripts/hearframe-rendered-live-qa.mjs
      - name: Commit rendered-route QA result
        if: always()
        run: |
          git config user.name 'hearframe-rendered-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/rendered/live-qa.json
          git commit -m 'Record Hearframe rendered live QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail on live QA failure
        if: steps.qa.outcome != 'success'
        run: exit 1
