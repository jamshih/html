name: Build Hearframe iPad-safe clips

on:
  push:
    paths:
      - 'hearframe-grand-v5/**'
      - '.github/workflows/hearframe-v5-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Cut short same-origin MP4 context clips
        shell: bash
        run: |
          set -euxo pipefail
          OUT="hearframe-grand-v4"
          mkdir -p "$OUT"

          OBAMA="https://upload.wikimedia.org/wikipedia/commons/transcoded/2/23/20170110_President_Obama_Farewell_Speech_HD.webm/20170110_President_Obama_Farewell_Speech_HD.webm.360p.vp9.webm"
          JFK="https://upload.wikimedia.org/wikipedia/commons/transcoded/7/74/John_F._Kennedy_Inauguration_Speech.ogv/John_F._Kennedy_Inauguration_Speech.ogv.360p.vp9.webm"

          COMMON=(-map 0:v:0 -map '0:a:0?' -vf "scale='min(640,iw)':-2" -c:v libx264 -preset veryfast -crf 23 -profile:v baseline -level 3.0 -pix_fmt yuv420p -c:a aac -b:a 128k -ac 2 -ar 44100 -movflags +faststart)

          ffmpeg -hide_banner -loglevel warning -y -ss 1.10 -i "$OBAMA" -t 1.60 "${COMMON[@]}" "$OUT/hello-context.mp4"
          ffmpeg -hide_banner -loglevel warning -y -ss 120.90 -i "$JFK" -t 1.75 "${COMMON[@]}" "$OUT/world-context.mp4"

          ffmpeg -hide_banner -loglevel warning -y -ss 0.368 -i "$OUT/hello-context.mp4" -t 0.367 "${COMMON[@]}" "$OUT/hello-default.mp4"
          ffmpeg -hide_banner -loglevel warning -y -ss 0.460 -i "$OUT/world-context.mp4" -t 0.440 "${COMMON[@]}" "$OUT/world-default.mp4"

          printf "file 'hello-default.mp4'\nfile 'world-default.mp4'\n" > "$OUT/concat.txt"
          ffmpeg -hide_banner -loglevel warning -y -f concat -safe 0 -i "$OUT/concat.txt" -c copy -movflags +faststart "$OUT/hello-world-default.mp4"
          rm "$OUT/concat.txt"

      - name: Install v5 frontend into current Hearframe publish folder
        run: cp hearframe-grand-v5/public/index.html hearframe-grand-v4/index.html

      - name: Verify generated media codecs and durations
        shell: bash
        run: |
          set -euxo pipefail
          for f in hearframe-grand-v4/hello-context.mp4 hearframe-grand-v4/world-context.mp4 hearframe-grand-v4/hello-default.mp4 hearframe-grand-v4/world-default.mp4 hearframe-grand-v4/hello-world-default.mp4; do
            echo "=== $f ==="
            ffprobe -v error -show_entries format=duration,format_name -show_entries stream=codec_name,codec_type,pix_fmt -of json "$f"
          done

      - name: Commit generated iPad-safe media
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "hearframe-media-builder"
          git config user.email "actions@users.noreply.github.com"
          git add hearframe-grand-v4/index.html hearframe-grand-v4/*.mp4
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build Hearframe iPad-safe MP4 clips"
          git push
