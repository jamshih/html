name: Wrongbook Recent Problem Open QA
on:
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/index.html'
      - 'wrongbook-v2/tutor-nav-visual-v16.js'
      - 'wrongbook-v2/tutor-workspace-unify-v13.js'
      - 'wrongbook-v2/tutor-dialog-compact-v20.js'
      - 'wrongbook-v2/problem-workspace-integrity-v1.js'
      - 'wrongbook-v2/ocr-clean-question-display-v1.js'
      - 'wrongbook-v2/native-question-capture-source-align-v1.js'
      - 'wrongbook-v2/qa/recent-problem-open-v21.html'
      - '.github/workflows/wrongbook-recent-problem-open-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wrongbook-v2/index.html'
      - 'wrongbook-v2/tutor-nav-visual-v16.js'
      - 'wrongbook-v2/tutor-workspace-unify-v13.js'
      - 'wrongbook-v2/tutor-dialog-compact-v20.js'
      - 'wrongbook-v2/problem-workspace-integrity-v1.js'
      - 'wrongbook-v2/ocr-clean-question-display-v1.js'
      - 'wrongbook-v2/native-question-capture-source-align-v1.js'
      - 'wrongbook-v2/qa/recent-problem-open-v21.html'
      - '.github/workflows/wrongbook-recent-problem-open-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recent-problem-open:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and crash contracts
        run: |
          node --check wrongbook-v2/tutor-nav-visual-v16.js
          node --check wrongbook-v2/tutor-workspace-unify-v13.js
          node --check wrongbook-v2/ocr-clean-question-display-v1.js
          node --check wrongbook-v2/native-question-capture-source-align-v1.js
          grep -q 'observerIdempotent' wrongbook-v2/tutor-nav-visual-v16.js
          grep -q 'observerIdempotent' wrongbook-v2/tutor-workspace-unify-v13.js
          grep -q 'ocrq-sheet v3-paper' wrongbook-v2/ocr-clean-question-display-v1.js
          grep -q 'ocrq-toolbar paper-toolbar' wrongbook-v2/ocr-clean-question-display-v1.js
          grep -q '20260818-1909' wrongbook-v2/native-question-capture-source-align-v1.js
          grep -q '2026-08-18-production-stability-1909' wrongbook-v2/index.html
          grep -Fq 'native-question-capture-source-align-v1.js?wb=20260818-1909' wrongbook-v2/index.html
      - name: Real browser recent-card regression
        run: |
          python3 -m http.server 8765 --directory wrongbook-v2 >/tmp/wb-recent-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          chromium --headless --no-sandbox --disable-gpu --window-size=1365,900 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/qa/recent-problem-open-v21.html > /tmp/wb-recent-dom.html
          cat /tmp/wb-recent-dom.html
          grep -q 'data-status="PASS"' /tmp/wb-recent-dom.html
          grep -q '"pass": true' /tmp/wb-recent-dom.html
          grep -q '"ocrIntegrityCompatible": true' /tmp/wb-recent-dom.html
          grep -q '"sameTutorDockAcrossPaging": true' /tmp/wb-recent-dom.html
