name: Hearframe MFA Gold Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/mfa-trigger.txt'

permissions:
  contents: write

jobs:
  mfa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mfa
          create-args: >-
            -c conda-forge
            montreal-forced-aligner
          cache-environment: true
      - name: Download MFA models
        shell: micromamba-shell {0}
        run: |
          mfa model download dictionary english_us_arpa
          mfa model download acoustic english_us_arpa
      - name: Run diagnostic
        id: diag
        shell: micromamba-shell {0}
        continue-on-error: true
        run: python .github/scripts/run-mfa-gold-diagnostic.py > hearframe-grand-v4/ask/mfa-diagnostic.log 2>&1
      - name: Commit diagnostic outputs
        if: always()
        run: |
          echo "outcome=${{ steps.diag.outcome }}" > hearframe-grand-v4/ask/mfa-diagnostic-result.txt
          git config user.name 'hearframe-mfa-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/mfa-diagnostic hearframe-grand-v4/ask/mfa-diagnostic.log hearframe-grand-v4/ask/mfa-diagnostic-result.txt || true
          git commit -m 'Record Hearframe MFA alignment diagnostic [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if diagnostic failed
        if: steps.diag.outcome != 'success'
        run: exit 1
