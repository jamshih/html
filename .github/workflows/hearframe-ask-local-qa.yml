name: Ask Hearframe Local QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/ask-local-qa-trigger.txt'

permissions:
  contents: write

jobs:
  local-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hearframe-ask-server.log 2>&1 &
          sleep 2
      - name: Run iPad/WebKit chat QA
        id: qa
        continue-on-error: true
        run: node .github/scripts/hearframe-ask-local-qa.mjs
      - name: Record QA
        if: always()
        run: |
          git config user.name 'hearframe-ask-local-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/local-qa.json || true
          git commit -m 'Record Ask Hearframe local QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
