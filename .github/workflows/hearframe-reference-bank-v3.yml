name: Build Hearframe 10K Reference Bank

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/reference-bank-v3-trigger.txt'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover 10,000 additional diverse licensed video references
        run: python .github/scripts/discover-hearframe-bank-v3.py
      - name: Commit 10K reference bank and report
        run: |
          git config user.name 'hearframe-bank-v3'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-bank-v3.json hearframe-grand-v4/ask/reference-bank-v3-report.json
          git commit -m 'Add 10,000 diverse Hearframe reference videos [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
