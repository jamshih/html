name: Build Hearframe 10K Reference Bank

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/reference-bank-v3-trigger.txt'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover 10,000 additional diverse licensed video references
        id: discover
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/scripts/discover-hearframe-bank-v3.py 2>&1 | tee hearframe-grand-v4/ask/reference-bank-v3-build.log
      - name: Record bank output or failure log
        if: always()
        run: |
          git config user.name 'hearframe-bank-v3'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/reference-bank-v3-build.log || true
          git add hearframe-grand-v4/ask/reference-bank-v3.json hearframe-grand-v4/ask/reference-bank-v3-report.json 2>/dev/null || true
          git commit -m 'Record Hearframe 10K reference-bank result [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if bank discovery failed
        if: steps.discover.outcome != 'success'
        run: exit 1
