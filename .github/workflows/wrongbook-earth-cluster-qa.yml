name: Wrongbook Earth Cluster QA

on:
  push:
    branches:
      - main
      - 'agent/earth-cluster-*'
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-earth-cluster-qa.yml'
  workflow_dispatch:

jobs:
  earth-cluster-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Traditional Chinese QA font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Install browser driver dependency
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: JavaScript syntax guard
        run: |
          for f in wrongbook-v2/*.js; do node --check "$f"; done
          node --check wrongbook-v2/earth-cluster-qa-v9.mjs
          node --check wrongbook-v2/earth-cluster-geometry-gate-v9.mjs
      - name: Capture canonical, source-gate, and mobile Earth QA
        env:
          EARTH_QA_OUT: /tmp/earth-cluster-qa
        run: |
          python3 -m http.server 4173 >/tmp/earth-cluster-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node wrongbook-v2/earth-cluster-qa-v9.mjs
          node wrongbook-v2/earth-cluster-geometry-gate-v9.mjs
          test "$(find /tmp/earth-cluster-qa -name 'p*-recall-current.png' | wc -l)" -eq 12
          test "$(find /tmp/earth-cluster-qa -name 'p*-learn-current.png' | wc -l)" -eq 12
          test "$(find /tmp/earth-cluster-qa -name 'mobile-ch*-recall.png' | wc -l)" -eq 6
          test "$(find /tmp/earth-cluster-qa -name 'mobile-ch*-learn.png' | wc -l)" -eq 6
          test -s /tmp/earth-cluster-qa/source-trace-e2e.json
          test -s /tmp/earth-cluster-qa/source-refinement-e2e.json
          test -s /tmp/earth-cluster-qa/geometry-gate.json
      - name: Upload Earth cluster QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-earth-cluster-qa
          if-no-files-found: warn
          path: |
            /tmp/earth-cluster-qa/*.png
            /tmp/earth-cluster-qa/*.json
            /tmp/earth-cluster-qa/*.txt

  live-earth-qa:
    if: github.ref == 'refs/heads/main'
    needs: earth-cluster-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Traditional Chinese QA font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Install browser driver dependency
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Wait for GitHub Pages to serve this Earth build
        run: |
          URL='https://jamshih.github.io/html/wrongbook-v2/earth-cluster-layout-v9-guards.css'
          for i in $(seq 1 36); do
            if curl -fsS "$URL" | grep -q 'Page 252 q26'; then
              echo 'GitHub Pages is serving the merged Earth cluster build.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for GitHub Pages to deploy the merged Earth cluster build.' >&2
          exit 1
      - name: Re-run the complete Earth QA against the live site
        env:
          EARTH_QA_BASE: https://jamshih.github.io/html/wrongbook-v2/
          EARTH_QA_OUT: /tmp/earth-live-qa
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node wrongbook-v2/earth-cluster-qa-v9.mjs
          node wrongbook-v2/earth-cluster-geometry-gate-v9.mjs
          test -s /tmp/earth-live-qa/source-trace-e2e.json
          test -s /tmp/earth-live-qa/source-refinement-e2e.json
          test -s /tmp/earth-live-qa/geometry-gate.json
      - name: Upload live Earth QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-earth-live-qa
          if-no-files-found: warn
          path: |
            /tmp/earth-live-qa/*.png
            /tmp/earth-live-qa/*.json
            /tmp/earth-live-qa/*.txt