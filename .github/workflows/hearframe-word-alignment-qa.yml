name: Hearframe Word Alignment QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/alignment-qa-trigger.txt'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install alignment stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'whisperx>=3.3,<4'
      - name: Run human-gold + long-sentence word-boundary QA
        id: qa
        continue-on-error: true
        run: python .github/scripts/validate-hearframe-word-alignment.py > hearframe-grand-v4/ask/word-alignment-build.log 2>&1
      - name: Record alignment report
        if: always()
        run: |
          echo "outcome=${{ steps.qa.outcome }}" > hearframe-grand-v4/ask/word-alignment-result.txt
          git config user.name 'hearframe-alignment-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/word-alignment-qa.json hearframe-grand-v4/ask/word-alignment-result.txt hearframe-grand-v4/ask/word-alignment-build.log || true
          git commit -m 'Record Hearframe word-alignment QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if boundary QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
