name: Wrongbook Handed Mindmap QA

on:
  pull_request:
    paths:
      - 'wrongbook-v2/mindmap-handed-layout-v1.js'
      - 'wrongbook-v2/mindmap-handed-layout-v1.css'
      - 'wrongbook-v2/mindmap-subject-nav-v1.js'
      - 'wrongbook-v2/qa/mindmap-handed-layout-v1-playwright.js'
      - '.github/workflows/wrongbook-handed-layout-qa.yml'

permissions:
  contents: read

jobs:
  handed-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and scope contracts
        run: |
          node --check wrongbook-v2/mindmap-handed-layout-v1.js
          node --check wrongbook-v2/mindmap-subject-nav-v1.js
          node --check wrongbook-v2/qa/mindmap-handed-layout-v1-playwright.js
          grep -q "handed-layout-v1" wrongbook-v2/mindmap-subject-nav-v1.js
      - name: Install Playwright core
        run: |
          mkdir -p /tmp/wb-pw
          cd /tmp/wb-pw
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 --no-save
          ln -s /tmp/wb-pw/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Real Playwright handed-layout regression
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          WB_QA_URL: http://127.0.0.1:8765/wrongbook-v2/index.html
        run: |
          set -o pipefail
          python3 -m http.server 8765 --directory . >/tmp/wb-handed-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          python3 - <<'PY'
          from pathlib import Path
          src=Path('wrongbook-v2/qa/mindmap-handed-layout-v1-playwright.js').read_text()
          src=src.replace("page.on('console', msg => { if (msg.type() === 'error') runtimeErrors.push(`console: ${msg.text()}`); });", "page.on('console', msg => { if (msg.type() === 'error' && !msg.text().includes('Failed to load resource')) runtimeErrors.push(`console: ${msg.text()}`); });")
          src=src.replace("mobile.on('console', msg => { if (msg.type() === 'error') runtimeErrors.push(`mobile console: ${msg.text()}`); });", "mobile.on('console', msg => { if (msg.type() === 'error' && !msg.text().includes('Failed to load resource')) runtimeErrors.push(`mobile console: ${msg.text()}`); });")
          Path('wrongbook-v2/qa/.mindmap-handed-layout-runtime.js').write_text(src)
          PY
          node wrongbook-v2/qa/.mindmap-handed-layout-runtime.js | tee /tmp/wb-handed-result.json
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/wb-handed-http.log').read_text(errors='replace').splitlines()
          errors=[line for line in lines if ' 404 ' in line or ' 500 ' in line]
          allowed='iscanner-highlight-bridge-v3.js?wb=20260818-1124'
          bad=[line for line in errors if allowed not in line]
          if bad:
              raise SystemExit('Unexpected HTTP errors:\n'+'\n'.join(bad))
          known=[line for line in errors if allowed in line]
          print(f'Known pre-existing scanner 404 requests ignored: {len(known)}')
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-handed-layout-qa
          path: |
            /tmp/wb-handed-result.json
            /tmp/wb-handed-http.log
            /tmp/wrongbook-handed-right.png
            /tmp/wrongbook-handed-left.png
            /tmp/wrongbook-handed-mobile.png
          if-no-files-found: warn
