name: Wrongbook Chemistry Reference QA

on:
  push:
    branches:
      - chemistry-reference-rebuild
    paths:
      - 'wrongbook-v2/chemistry-reference-*.js'
      - 'wrongbook-v2/chemistry-reference-*.css'
      - 'wrongbook-v2/qa/chemistry-page1-qa.html'
      - 'wrongbook-v2/index.html'
      - '.github/workflows/wrongbook-chemistry-reference-qa.yml'
  pull_request:
    paths:
      - 'wrongbook-v2/chemistry-reference-*.js'
      - 'wrongbook-v2/chemistry-reference-*.css'
      - 'wrongbook-v2/qa/chemistry-page1-qa.html'
      - 'wrongbook-v2/index.html'
      - '.github/workflows/wrongbook-chemistry-reference-qa.yml'
  workflow_dispatch:

jobs:
  chemistry-page-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Traditional Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: JavaScript syntax
        run: |
          node --check wrongbook-v2/chemistry-reference-v1.js
          node --check wrongbook-v2/chemistry-reference-scope-page1-v2.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory wrongbook-v2 > /tmp/chem-http.log 2>&1 &
          echo $! > /tmp/chem-http.pid
          sleep 2
      - name: Render Recall page and run DOM QA
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chrome/Chromium executable available on runner.' >&2
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1800 --virtual-time-budget=2500 --screenshot=chemistry-page1-recall.png http://127.0.0.1:4173/qa/chemistry-page1-qa.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom http://127.0.0.1:4173/qa/chemistry-page1-qa.html > chemistry-page1-dom.html
          grep -q 'data-qa-pass="true"' chemistry-page1-dom.html
          grep -q 'data-qa-questions="21"' chemistry-page1-dom.html
          grep -q 'data-qa-blanks="36"' chemistry-page1-dom.html
          grep -q 'data-qa-figures="11"' chemistry-page1-dom.html
      - name: Upload rendered QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-chemistry-page1-qa
          path: |
            chemistry-page1-recall.png
            chemistry-page1-dom.html
          if-no-files-found: warn
