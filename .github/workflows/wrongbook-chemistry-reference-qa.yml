name: Wrongbook Chemistry Reference QA

on:
  push:
    branches:
      - chemistry-reference-rebuild
    paths:
      - 'wrongbook-v2/chemistry-*.js'
      - 'wrongbook-v2/chemistry-*.css'
      - 'wrongbook-v2/qa/chemistry-v2-qa.html'
      - 'wrongbook-v2/index.html'
      - '.github/workflows/wrongbook-chemistry-reference-qa.yml'
  pull_request:
    paths:
      - 'wrongbook-v2/chemistry-*.js'
      - 'wrongbook-v2/chemistry-*.css'
      - 'wrongbook-v2/qa/chemistry-v2-qa.html'
      - 'wrongbook-v2/index.html'
      - '.github/workflows/wrongbook-chemistry-reference-qa.yml'
  workflow_dispatch:

jobs:
  chemistry-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Traditional Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: JavaScript syntax
        run: |
          node --check wrongbook-v2/chemistry-reference-v1.js
          node --check wrongbook-v2/chemistry-reference-scope-page1-v2.js
          node --check wrongbook-v2/chemistry-reference-page1-fix-v3.js
          node --check wrongbook-v2/chemistry-gsat-page2-v4.js
          node --check wrongbook-v2/chemistry-gsat-page2-fix-v5.js
          node --check wrongbook-v2/chemistry-reference-v2-core.js
          node --check wrongbook-v2/chemistry-reference-gsat-v2.js
          node --check wrongbook-v2/chemistry-reference-elective-v2.js
          node --check wrongbook-v2/chemistry-reference-completion-v2.js
          node --check wrongbook-v2/chemistry-reference-qa-v2.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory wrongbook-v2 > /tmp/chem-http.log 2>&1 &
          echo $! > /tmp/chem-http.pid
          sleep 2
      - name: Render complete production Chemistry corpus and run DOM QA
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          mkdir -p chemistry-v2-artifacts
          PAGES="gsat-01 gsat-02 gsat-03 gsat-04 gsat-05 gsat-06 elec-matter-energy elec-structure-rate elec-equilibrium-1 elec-equilibrium-2 elec-organic-tech"
          for PAGE in $PAGES; do
            echo "=== Render $PAGE ==="
            URL="http://127.0.0.1:4173/qa/chemistry-v2-qa.html?page=$PAGE"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1800 --virtual-time-budget=3000 --screenshot="chemistry-v2-artifacts/${PAGE}.png" "$URL"
            "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$URL" > "chemistry-v2-artifacts/${PAGE}.html"
            grep -q 'data-qa-pass="true"' "chemistry-v2-artifacts/${PAGE}.html"
            grep -q "data-qa-page=\"${PAGE}\"" "chemistry-v2-artifacts/${PAGE}.html"
          done
      - name: Upload rendered QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-chemistry-pages-qa
          path: chemistry-v2-artifacts/
          if-no-files-found: warn
