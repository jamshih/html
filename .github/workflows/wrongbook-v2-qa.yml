name: Wrongbook V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-v2-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in wrongbook-v2/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Taiwan terminology guard
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const curriculumFiles=['curriculum-tw.js','curriculum-more-tw.js','curriculum-tw-fixes.js'];
          const src=curriculumFiles.map(f=>fs.readFileSync('wrongbook-v2/'+f,'utf8')).join('\n')+'\n;globalThis.__C=CURRICULUM_TW;';
          const ctx={};vm.createContext(ctx);vm.runInContext(src,ctx);
          const C=ctx.__C;
          const text=JSON.stringify(C);
          const banned=['線粒體','高爾基體','溶酶體','概率','種群','群落','生境','質粒','數據','視頻','信息','矢量','網絡','軟件','硬件','激活能'];
          for(const term of banned)if(text.includes(term))throw new Error(`normalized curriculum contains non-Taiwan preferred term: ${term}`);
          if(/(^|[^演])算法/.test(text))throw new Error('normalized curriculum contains 算法 instead of 演算法');
          const otherFiles=fs.readdirSync('wrongbook-v2').filter(f=>/\.(js|html)$/.test(f)&&!curriculumFiles.includes(f)&&f!=='tw-ui-guard.js');
          for(const f of otherFiles){
            const t=fs.readFileSync('wrongbook-v2/'+f,'utf8');
            for(const term of banned)if(t.includes(term))throw new Error(`${f} contains non-Taiwan preferred term: ${term}`);
            if(/(^|[^演])算法/.test(t))throw new Error(`${f} contains 算法 instead of 演算法`);
          }
          console.log('Taiwan terminology guard passed after normalization');
          NODE
      - name: Required curriculum coverage
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=['curriculum-tw.js','curriculum-more-tw.js','curriculum-tw-fixes.js'].map(f=>fs.readFileSync('wrongbook-v2/'+f,'utf8')).join('\n')+'\n;globalThis.__C=CURRICULUM_TW;';
          const ctx={};vm.createContext(ctx);vm.runInContext(src,ctx);
          const C=ctx.__C;
          const required=['chinese','english','math','physics','chemistry','biology','earth','history','geography','civics'];
          for(const s of required){
            if(!C[s]||!Array.isArray(C[s].chapters)||!C[s].chapters.length)throw new Error(`missing ${s}`);
            for(const ch of C[s].chapters){
              if(!ch.sections?.length)throw new Error(`${s}/${ch.title} has no sections`);
              for(const sec of ch.sections)if(!sec.points?.length)throw new Error(`${s}/${ch.title}/${sec.title} has no points`);
            }
          }
          const minChapters={physics:12,earth:10,chinese:8,english:8,history:10,geography:10,civics:10};
          const pointCount=s=>C[s].chapters.flatMap(ch=>ch.sections).flatMap(sec=>sec.points).length;
          for(const [s,n] of Object.entries(minChapters))if(C[s].chapters.length<n)throw new Error(`${s} only has ${C[s].chapters.length} chapters; expected at least ${n}`);
          for(const s of Object.keys(minChapters))if(pointCount(s)<45)throw new Error(`${s} only has ${pointCount(s)} recall points; expected at least 45`);
          console.log('subjects',required.length,'chapters',required.reduce((n,s)=>n+C[s].chapters.length,0),'expanded points',Object.fromEntries(Object.keys(minChapters).map(s=>[s,pointCount(s)])));
          NODE
