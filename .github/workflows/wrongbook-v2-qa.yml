name: Wrongbook V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-v2-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in wrongbook-v2/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Taiwan terminology guard
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[p for p in Path('wrongbook-v2').glob('*') if p.suffix in {'.js','.html'}]
          banned=['線粒體','高爾基體','溶酶體','概率','種群','群落','生境','質粒','數據','視頻','信息']
          # curriculum-tw.js intentionally contains banned terms only inside the replacement policy itself.
          failures=[]
          for p in files:
              text=p.read_text(encoding='utf-8')
              if p.name=='curriculum-tw.js':
                  marker='const CURRICULUM_TW='
                  text=text.split(marker,1)[1] if marker in text else text
              for term in banned:
                  if term in text:
                      failures.append(f'{p}: contains non-Taiwan preferred term {term}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Taiwan terminology guard passed')
          PY
      - name: Required curriculum coverage
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('wrongbook-v2/curriculum-tw.js','utf8')+'\n;globalThis.__C=CURRICULUM_TW;';
          const ctx={};vm.createContext(ctx);vm.runInContext(src,ctx);
          const C=ctx.__C;
          const required=['chinese','english','math','physics','chemistry','biology','earth','history','geography','civics'];
          for(const s of required){
            if(!C[s]||!Array.isArray(C[s].chapters)||!C[s].chapters.length)throw new Error(`missing ${s}`);
            for(const ch of C[s].chapters){
              if(!ch.sections?.length)throw new Error(`${s}/${ch.title} has no sections`);
              for(const sec of ch.sections)if(!sec.points?.length)throw new Error(`${s}/${ch.title}/${sec.title} has no points`);
            }
          }
          console.log('subjects',required.length,'chapters',required.reduce((n,s)=>n+C[s].chapters.length,0));
          NODE
