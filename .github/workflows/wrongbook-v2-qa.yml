name: Wrongbook V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-v2-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in wrongbook-v2/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Taiwan terminology guard
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const curriculumFiles=['curriculum-tw.js','curriculum-more-tw.js','curriculum-tw-fixes.js'];
          const src=curriculumFiles.map(f=>fs.readFileSync('wrongbook-v2/'+f,'utf8')).join('\n')+'\n;globalThis.__C=CURRICULUM_TW;';
          const ctx={};vm.createContext(ctx);vm.runInContext(src,ctx);
          const C=ctx.__C;
          const text=JSON.stringify(C);
          const banned=['線粒體','高爾基體','溶酶體','概率','種群','群落','生境','質粒','數據','視頻','信息','矢量','網絡','軟件','硬件','激活能'];
          for(const term of banned)if(text.includes(term))throw new Error(`normalized curriculum contains non-Taiwan preferred term: ${term}`);
          if(/(^|[^演])算法/.test(text))throw new Error('normalized curriculum contains 算法 instead of 演算法');
          const otherFiles=fs.readdirSync('wrongbook-v2').filter(f=>/\.(js|html)$/.test(f)&&!curriculumFiles.includes(f)&&f!=='tw-ui-guard.js');
          for(const f of otherFiles){
            let t=fs.readFileSync('wrongbook-v2/'+f,'utf8');
            if(f==='product-engine-v3.js') t=t.replace(/\.replaceAll\('[^']+','[^']+'\)/g,'');
            for(const term of banned)if(t.includes(term))throw new Error(`${f} contains non-Taiwan preferred term: ${term}`);
            if(/(^|[^演])算法/.test(t))throw new Error(`${f} contains 算法 instead of 演算法`);
          }
          console.log('Taiwan terminology guard passed after normalization');
          NODE
      - name: Required curriculum coverage
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=['curriculum-tw.js','curriculum-more-tw.js','curriculum-tw-fixes.js'].map(f=>fs.readFileSync('wrongbook-v2/'+f,'utf8')).join('\n')+'\n;globalThis.__C=CURRICULUM_TW;';
          const ctx={};vm.createContext(ctx);vm.runInContext(src,ctx);
          const C=ctx.__C;
          const required=['chinese','english','math','physics','chemistry','biology','earth','history','geography','civics'];
          for(const s of required){
            if(!C[s]||!Array.isArray(C[s].chapters)||!C[s].chapters.length)throw new Error(`missing ${s}`);
            for(const ch of C[s].chapters){
              if(!ch.sections?.length)throw new Error(`${s}/${ch.title} has no sections`);
              for(const sec of ch.sections)if(!sec.points?.length)throw new Error(`${s}/${ch.title}/${sec.title} has no points`);
            }
          }
          const minChapters={physics:12,earth:10,chinese:8,english:8,history:10,geography:10,civics:10};
          const pointCount=s=>C[s].chapters.flatMap(ch=>ch.sections).flatMap(sec=>sec.points).length;
          for(const [s,n] of Object.entries(minChapters))if(C[s].chapters.length<n)throw new Error(`${s} only has ${C[s].chapters.length} chapters; expected at least ${n}`);
          for(const s of Object.keys(minChapters))if(pointCount(s)<45)throw new Error(`${s} only has ${pointCount(s)} recall points; expected at least 45`);
          console.log('subjects',required.length,'chapters',required.reduce((n,s)=>n+C[s].chapters.length,0),'expanded points',Object.fromEntries(Object.keys(minChapters).map(s=>[s,pointCount(s)])));
          NODE
      - name: V3 product promises are implemented
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('wrongbook-v2/index.html','utf8');
          const engine=fs.readFileSync('wrongbook-v2/product-engine-v3.js','utf8');
          const hotfix=fs.readFileSync('wrongbook-v2/product-engine-v3-hotfix.js','utf8');
          const guide=fs.readFileSync('wrongbook-v2/guide-v3.js','utf8');
          if(index.includes('app-1.js')) throw new Error('index still references missing app-1.js');
          for(const asset of ['product-engine-v3.css','product-engine-v3.js','product-engine-v3-hotfix.js','guide-v3.css','guide-v3.js','e2e-v3.js','earth-reference-maps-v4.js','earth-reference-renderer-v4.js']) if(!index.includes(asset)) throw new Error(`index missing ${asset}`);
          const required=[['per-problem image store','v3PutImage'],['first-class truths','v3CreateTruth'],['spaced review scheduler','v3Schedule'],['Chinese correction cloze','v3ChangedSegment'],['multi-concept storage','concepts'],['progressive mind hints','mindHintLevels'],['real concept analytics','最需要處理的概念'],['OCR correction UI','data-scan-problem-text'],['actual annotation SVG','v3-ai-svg']];
          for(const [name,needle] of required) if(!engine.includes(needle)) throw new Error(`missing ${name}`);
          for(const needle of ['v3WorkspaceImage','v3ThreadCode']) if(!hotfix.includes(needle)) throw new Error(`hotfix missing ${needle}`);
          for(const [name,needle] of [['guide generation/cache','v3GuidePrepare'],['handwriting animation','v3DrawWrite'],['circle animation','v3DrawCircle'],['guide replay','v3GuideReplay'],['background pre-generation','v3GuideBaseConfirmScan']]) if(!guide.includes(needle))throw new Error(`missing ${name}`);
          console.log('V3 product implementation guard passed');
          NODE
      - name: Rendered Chromium smoke test
        run: |
          python3 -m http.server 4173 >/tmp/wrongbook-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          for SPEC in desktop:1440,1000 mobile:390,844; do
            NAME="${SPEC%%:*}"
            SIZE="${SPEC#*:}"
            PROFILE="/tmp/wrongbook-source-$NAME"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$PROFILE" --window-size="$SIZE" --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?sourcee2e=1" > "/tmp/wrongbook-$NAME.html"
            python3 - "/tmp/wrongbook-$NAME.html" <<'PY'
          from pathlib import Path
          import html,re,sys
          text=Path(sys.argv[1]).read_text(errors='replace')
          m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',text,re.S)
          if not m:
              print('E2E result node missing')
              raise SystemExit(1)
          status=m.group(1)
          print(html.unescape(m.group(2)))
          if status!='PASS': raise SystemExit(1)
          PY
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="${PROFILE}-shot" --window-size="$SIZE" --virtual-time-budget=3000 --screenshot="/tmp/wrongbook-$NAME.png" "http://127.0.0.1:4173/wrongbook-v2/"
          done
          for CH in 1 2 3 4 5 6; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/wrongbook-ref-$CH" --window-size=1800,1200 --virtual-time-budget=4500 --screenshot="/tmp/wrongbook-ref-ch${CH}.png" "http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
          done
      - name: Upload rendered QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wrongbook-v3-rendered-qa
          path: |
            /tmp/wrongbook-desktop.png
            /tmp/wrongbook-mobile.png
            /tmp/wrongbook-ref-ch1.png
            /tmp/wrongbook-ref-ch2.png
            /tmp/wrongbook-ref-ch3.png
            /tmp/wrongbook-ref-ch4.png
            /tmp/wrongbook-ref-ch5.png
            /tmp/wrongbook-ref-ch6.png
