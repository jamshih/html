name: Temporary PP-DocLayoutV3 assembler

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-ppdoclayout-assemble.yml

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and assemble verified model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 5 'https://rfpkznuntzxfoeeavwwf.supabase.co/storage/v1/object/public/tmp-model-transfer/PP-DocLayoutV3/chunks/part-0.bin' -o out/part-0.bin
          curl -L --fail --retry 5 'https://rfpkznuntzxfoeeavwwf.supabase.co/storage/v1/object/public/tmp-model-transfer/PP-DocLayoutV3/chunks/part-1.bin' -o out/part-1.bin
          curl -L --fail --retry 5 'https://rfpkznuntzxfoeeavwwf.supabase.co/storage/v1/object/public/tmp-model-transfer/PP-DocLayoutV3/chunks/part-2.bin' -o out/part-2.bin
          curl -L --fail --retry 5 'https://rfpkznuntzxfoeeavwwf.supabase.co/storage/v1/object/public/tmp-model-transfer/PP-DocLayoutV3/chunks/part-3.bin' -o out/part-3.bin
          cat out/part-0.bin out/part-1.bin out/part-2.bin out/part-3.bin > out/inference.onnx
          test "$(stat -c%s out/inference.onnx)" = "130502049"
          echo '45bf71750b00739a41fc209f132eb104a4d6b5bb29483c9078164d8b87cf28ba  out/inference.onnx' | sha256sum -c -
          printf '%s\n' '45bf71750b00739a41fc209f132eb104a4d6b5bb29483c9078164d8b87cf28ba' > out/SHA256.txt
          rm out/part-*.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp-doclayoutv3-official
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
