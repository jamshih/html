name: Wrongbook Clearnote Enrichment Temp QA

on:
  push:
    branches: [wrongbook-clearnote-enrichment-20260817]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-clearnote-enrichment-temp.yml'
  workflow_dispatch:

jobs:
  mindmap-enrichment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Traditional Chinese rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Syntax
        run: |
          node --check wrongbook-v2/mindmap-textbook-v4.js
          node --check wrongbook-v2/mindmap-skill-qa-v1.js
          ! grep -q 'function v4tbMascot' wrongbook-v2/mindmap-textbook-v4.js
          grep -q "data-v4tb-layout" wrongbook-v2/mindmap-textbook-v4.js
          grep -q "timelineWithoutSequenceSemantics" wrongbook-v2/mindmap-skill-qa-v1.js
          grep -q "bannedMainlandTerm" wrongbook-v2/mindmap-skill-qa-v1.js
      - name: Inject screenshot helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrongbook-v2/index.html')
          t=p.read_text()
          marker='<script src="./mindmap-skill-shot-v1.js"></script>'
          if marker not in t:t=t.replace('</body>',marker+'</body>')
          p.write_text(t)
          PY
      - name: Start server
        run: |
          nohup python3 -m http.server 4173 >/tmp/wrongbook-clearnote-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:4173/wrongbook-v2/ >/dev/null
      - name: Desktop all-subject semantic-layout gate
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/clearnote-desktop --window-size=1600,1200 --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?mindmapskillqa=1" >/tmp/clearnote-desktop.html
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          t=Path('/tmp/clearnote-desktop.html').read_text(errors='replace')
          m=re.search(r'<pre id="mindmap-skill-qa-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m: raise SystemExit('missing qa payload')
          d=json.loads(html.unescape(m.group(2)))
          Path('/tmp/clearnote-desktop.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          print(json.dumps({k:d.get(k) for k in ['status','chaptersExpected','chaptersRendered','canonicalExpected','canonicalRendered','layoutTotals','totals']},ensure_ascii=False,indent=2))
          if d.get('status')!='PASS': raise SystemExit(1)
          PY
      - name: Mobile all-subject semantic-layout gate
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/clearnote-mobile --window-size=390,844 --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?mindmapskillqa=1" >/tmp/clearnote-mobile.html
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          t=Path('/tmp/clearnote-mobile.html').read_text(errors='replace')
          m=re.search(r'<pre id="mindmap-skill-qa-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m: raise SystemExit('missing qa payload')
          d=json.loads(html.unescape(m.group(2)))
          Path('/tmp/clearnote-mobile.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          print(json.dumps({k:d.get(k) for k in ['status','chaptersExpected','chaptersRendered','canonicalExpected','canonicalRendered','layoutTotals','totals']},ensure_ascii=False,indent=2))
          if d.get('status')!='PASS': raise SystemExit(1)
          PY
      - name: Current Earth regressions
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for Q in sourcee2e=1 refinee2e=1; do
            NAME="${Q%%=*}"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/clearnote-$NAME" --window-size=1440,1000 --virtual-time-budget=30000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?$Q" > "/tmp/clearnote-$NAME.html"
            python3 - "$NAME" <<'PY'
          from pathlib import Path
          import re,html,json,sys
          name=sys.argv[1]; t=Path(f'/tmp/clearnote-{name}.html').read_text(errors='replace')
          m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m: raise SystemExit(f'{name}: missing e2e payload')
          d=json.loads(html.unescape(m.group(2))); print(name, d.get('status'))
          if d.get('status')!='PASS': print(json.dumps(d,ensure_ascii=False,indent=2)); raise SystemExit(1)
          PY
          done
      - name: Representative screenshots
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/clearnote-shots
          for SUBJECT in chinese english math physics chemistry biology history geography civics; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/shot-d-$SUBJECT" --window-size=1600,1500 --virtual-time-budget=10000 --screenshot="/tmp/clearnote-shots/${SUBJECT}-desktop.png" "http://127.0.0.1:4173/wrongbook-v2/?mindmapshot=$SUBJECT&shotchapter=0"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/shot-m-$SUBJECT" --window-size=390,844 --virtual-time-budget=10000 --screenshot="/tmp/clearnote-shots/${SUBJECT}-mobile.png" "http://127.0.0.1:4173/wrongbook-v2/?mindmapshot=$SUBJECT&shotchapter=0"
          done
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrongbook-clearnote-enrichment-proof
          path: |
            /tmp/clearnote-desktop.json
            /tmp/clearnote-mobile.json
            /tmp/clearnote-shots/*.png
            /tmp/clearnote-sourcee2e.html
            /tmp/clearnote-refinee2e.html
            /tmp/wrongbook-clearnote-http.log
