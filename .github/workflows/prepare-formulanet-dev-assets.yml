name: Prepare FormulaNet dev assets

on:
  push:
    branches:
      - automation/formulanet-dev-assets-20260921

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify PP-FormulaNet-S
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p FormulaNet
          curl -L --fail --retry 5 --retry-delay 2             "https://github.com/GreatV/oar-ocr/releases/download/v0.3.0/pp-formulanet-s.onnx"             -o FormulaNet/pp-formulanet-s.onnx
          curl -L --fail --retry 5 --retry-delay 2             "https://www.modelscope.cn/api/v1/models/greatv/oar-ocr/repo?Revision=master&FilePath=pp-formulanet-tokenizer.json"             -o FormulaNet/pp-formulanet-tokenizer.json

          test "$(stat -c %s FormulaNet/pp-formulanet-s.onnx)" = "231878904"
          test "$(stat -c %s FormulaNet/pp-formulanet-tokenizer.json)" = "2140014"

          echo "0ee32c7bfbd9e586364f89f71860476ccb5334e35674a61f3df5e0553d6a6dcc  FormulaNet/pp-formulanet-s.onnx" | sha256sum -c -
          echo "2811d82701ec97c192fa256aa2b4516929373870ae660326cc5b1dc879b95ff2  FormulaNet/pp-formulanet-tokenizer.json" | sha256sum -c -

      - name: Upload verified FormulaNet assets
        uses: actions/upload-artifact@v4
        with:
          name: pp-formulanet-s-dev-assets
          path: FormulaNet/
          compression-level: 0
          retention-days: 1
