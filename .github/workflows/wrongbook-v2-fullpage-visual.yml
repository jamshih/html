name: Wrongbook V2 Full-page Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-v2-fullpage-visual.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Traditional Chinese QA font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Capture complete Earth chapter spreads
        run: |
          python3 -m http.server 4173 >/tmp/wrongbook-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for CH in 1 2 3 4 5 6; do
            URL="http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir="/tmp/wrongbook-full-$CH" \
              --window-size=2400,1500 --virtual-time-budget=5000 \
              --screenshot="/tmp/wrongbook-full-ch${CH}.png" "$URL"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir="/tmp/wrongbook-dom-$CH" \
              --window-size=2400,1500 --virtual-time-budget=5000 \
              --dump-dom "$URL" > "/tmp/wrongbook-full-ch${CH}.html"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wrongbook-earth-fullpage-visual
          path: |
            /tmp/wrongbook-full-ch*.png
            /tmp/wrongbook-full-ch*.html
