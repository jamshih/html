name: Hearframe AI Refine v2 Live QA

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/ai-refine-v2-live-qa-trigger.txt'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run public v2 refinement QA
        id: qa
        continue-on-error: true
        run: node .github/scripts/hearframe-ai-refine-v2-live-qa.mjs
      - name: Record result
        if: always()
        run: |
          git config user.name 'hearframe-ai-refine-v2-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ai-refine-v2-live-qa.json || true
          git commit -m 'Record Hearframe AI refine v2 live QA [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
