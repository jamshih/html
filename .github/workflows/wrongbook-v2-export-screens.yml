name: Wrongbook V2 Visual QA Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wrongbook-v2-export-screens.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Traditional Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK TC'
      - name: Render six Earth Science chapter spreads
        run: |
          python3 -m http.server 4173 >/tmp/wrongbook-export-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/wrongbook-v7-cjk
          for CH in 1 2 3 4 5 6; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir="/tmp/wrongbook-export-$CH" \
              --window-size=1800,1200 --virtual-time-budget=5000 \
              --screenshot="/tmp/wrongbook-v7-cjk/ch${CH}.png" \
              "http://127.0.0.1:4173/wrongbook-v2/?refpreview=1&chapter=${CH}&mode=recall"
          done
          git rev-parse HEAD > /tmp/wrongbook-v7-cjk/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wrongbook-v7-cjk-visual
          path: /tmp/wrongbook-v7-cjk
