name: Wrongbook Mind Map Skill Temp QA

on:
  push:
    branches: [wrongbook-mind-map-skill-20260817]
    paths:
      - 'wrongbook-v2/**'
      - '.github/workflows/wrongbook-mind-map-skill-temp.yml'
  workflow_dispatch:

jobs:
  cross-subject-mindmaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Traditional Chinese rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans TC'

      - name: Syntax and forbidden-artifact guards
        run: |
          node --check wrongbook-v2/mindmap-textbook-v4.js
          node --check wrongbook-v2/mindmap-skill-qa-v1.js
          node --check wrongbook-v2/mindmap-skill-shot-v1.js
          node --check wrongbook-v2/paper-first-compat-restore-v1.js
          ! grep -q 'function v4tbMascot' wrongbook-v2/mindmap-textbook-v4.js
          ! grep -q 'v4tbPageNumber\|v4tbSplitSections\|v4tbPageHeader\|v4tb-blank-no' wrongbook-v2/mindmap-textbook-v4.js
          ! grep -q 'v4tb-slot:after\|v4tb-flow-visual:before' wrongbook-v2/mindmap-textbook-v4.css
          grep -qi 'mind map making skill' wrongbook-v2/MIND_MAP_MAKING_SKILL.md

      - name: Inject visual-proof helper for this runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrongbook-v2/index.html')
          t=p.read_text()
          marker='<script src="./mindmap-skill-shot-v1.js"></script>'
          if marker not in t:
              t=t.replace('</body>',marker+'</body>')
          p.write_text(t)
          PY

      - name: Start Wrongbook test server
        run: |
          nohup python3 -m http.server 4173 >/tmp/wrongbook-mindmap-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:4173/wrongbook-v2/ >/dev/null

      - name: Run all non-Earth chapters — desktop geometry gate
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/mindmap-desktop --window-size=1600,1200 --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?mindmapskillqa=1" > /tmp/mindmap-skill-desktop.html
          python3 - <<'PY'
          from pathlib import Path
          import html,re,json
          t=Path('/tmp/mindmap-skill-desktop.html').read_text(errors='replace')
          m=re.search(r'<pre id="mindmap-skill-qa-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m:
              print(t[-5000:])
              raise SystemExit('mindmap-skill-qa-results missing')
          data=json.loads(html.unescape(m.group(2)))
          Path('/tmp/mindmap-skill-desktop.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print(json.dumps({k:data.get(k) for k in ['status','viewport','subjectsExpected','chaptersExpected','chaptersRendered','canonicalExpected','canonicalRendered','totals']},ensure_ascii=False,indent=2))
          if m.group(1)!='PASS' or data.get('status')!='PASS': raise SystemExit(1)
          PY

      - name: Run all non-Earth chapters — mobile geometry gate
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/mindmap-mobile --window-size=390,844 --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?mindmapskillqa=1" > /tmp/mindmap-skill-mobile.html
          python3 - <<'PY'
          from pathlib import Path
          import html,re,json
          t=Path('/tmp/mindmap-skill-mobile.html').read_text(errors='replace')
          m=re.search(r'<pre id="mindmap-skill-qa-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m:
              print(t[-5000:])
              raise SystemExit('mindmap-skill-qa-results missing')
          data=json.loads(html.unescape(m.group(2)))
          Path('/tmp/mindmap-skill-mobile.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print(json.dumps({k:data.get(k) for k in ['status','viewport','subjectsExpected','chaptersExpected','chaptersRendered','canonicalExpected','canonicalRendered','totals']},ensure_ascii=False,indent=2))
          if m.group(1)!='PASS' or data.get('status')!='PASS': raise SystemExit(1)
          PY

      - name: Record legacy broad E2E as non-blocking diagnostic
        continue-on-error: true
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/mindmap-legacy-e2e --window-size=1440,1000 --virtual-time-budget=90000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?e2e=1" > /tmp/mindmap-current-e2e.html
          python3 - <<'PY'
          from pathlib import Path
          import html,re,json
          t=Path('/tmp/mindmap-current-e2e.html').read_text(errors='replace')
          m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m:
              raise SystemExit('legacy e2e result missing')
          data=json.loads(html.unescape(m.group(2)))
          print(json.dumps({'status':data.get('status'),'error':data.get('error'),'failed':[x for x in data.get('results',[]) if not x.get('ok')]},ensure_ascii=False,indent=2))
          PY

      - name: Run current Earth source-truth regression gates
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          parse_e2e() {
            python3 - "$1" <<'PY'
          from pathlib import Path
          import html,re,json,sys
          t=Path(sys.argv[1]).read_text(errors='replace')
          m=re.search(r'<pre id="e2e-results" data-status="([^"]+)">(.*?)</pre>',t,re.S)
          if not m:
              print(t[-5000:])
              raise SystemExit('e2e-results missing')
          data=json.loads(html.unescape(m.group(2)))
          print(json.dumps({'status':data.get('status'),'viewport':data.get('viewport'),'error':data.get('error'),'failed':[x for x in data.get('results',[]) if not x.get('ok')]},ensure_ascii=False,indent=2))
          if m.group(1)!='PASS' or data.get('status')!='PASS': raise SystemExit(1)
          PY
          }
          for Q in sourcee2e=1 refinee2e=1; do
            NAME="${Q%%=*}"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/mindmap-$NAME" --window-size=1440,1000 --virtual-time-budget=30000 --dump-dom "http://127.0.0.1:4173/wrongbook-v2/?$Q" > "/tmp/mindmap-$NAME.html"
            parse_e2e "/tmp/mindmap-$NAME.html"
          done

      - name: Capture representative visual proof for every non-Earth subject
        if: always()
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          mkdir -p /tmp/mindmap-shots
          for SUBJECT in chinese english math physics chemistry biology history geography civics; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/mindmap-shot-desktop-$SUBJECT" --window-size=1600,1500 --virtual-time-budget=12000 --screenshot="/tmp/mindmap-shots/${SUBJECT}-desktop.png" "http://127.0.0.1:4173/wrongbook-v2/?mindmapshot=$SUBJECT&shotchapter=0"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/mindmap-shot-mobile-$SUBJECT" --window-size=390,844 --virtual-time-budget=12000 --screenshot="/tmp/mindmap-shots/${SUBJECT}-mobile.png" "http://127.0.0.1:4173/wrongbook-v2/?mindmapshot=$SUBJECT&shotchapter=0"
          done

      - name: Upload cross-subject QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrongbook-mind-map-skill-proof
          path: |
            /tmp/mindmap-skill-desktop.html
            /tmp/mindmap-skill-desktop.json
            /tmp/mindmap-skill-mobile.html
            /tmp/mindmap-skill-mobile.json
            /tmp/mindmap-current-e2e.html
            /tmp/mindmap-sourcee2e.html
            /tmp/mindmap-refinee2e.html
            /tmp/mindmap-shots/*.png
            /tmp/wrongbook-mindmap-http.log
