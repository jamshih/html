name: Wrongbook Root Subject Navigation QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'wrongbook-v2/mindmap-root-subject-nav-v1.js'
      - 'wrongbook-v2/mindmap-root-subject-nav-v1.css'
      - 'wrongbook-v2/mindmap-subject-nav-v1.js'
      - 'wrongbook-v2/mindmap-radial-runtime-fix-v3.js'
      - 'wrongbook-v2/qa/root-subject-nav-v1.html'
      - '.github/workflows/wrongbook-root-subject-nav-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-subject-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and scope contracts
        run: |
          node --check wrongbook-v2/mindmap-root-subject-nav-v1.js
          node --check wrongbook-v2/mindmap-subject-nav-v1.js
          node --check wrongbook-v2/mindmap-radial-runtime-fix-v3.js
          grep -q 'root-subject-nav-v1' wrongbook-v2/mindmap-subject-nav-v1.js
          grep -q 'mindmap-subject-nav-v3' wrongbook-v2/mindmap-radial-runtime-fix-v3.js
      - name: Real browser root navigation regression
        run: |
          python3 -m http.server 8765 --directory wrongbook-v2 >/tmp/wb-root-nav-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          chromium --headless --no-sandbox --disable-gpu --window-size=1450,900 --virtual-time-budget=55000 --dump-dom http://127.0.0.1:8765/qa/root-subject-nav-v1.html > /tmp/wb-root-nav-dom.html
          cat /tmp/wb-root-nav-dom.html
          grep -q 'data-status="PASS"' /tmp/wb-root-nav-dom.html
          grep -q '"pass": true' /tmp/wb-root-nav-dom.html
          grep -q '"buttonCount": 10' /tmp/wb-root-nav-dom.html
          grep -q '"runtimeErrors": \[\]' /tmp/wb-root-nav-dom.html
          chromium --headless --no-sandbox --disable-gpu --window-size=1450,900 --virtual-time-budget=55000 --screenshot=/tmp/wrongbook-root-subject-nav.png http://127.0.0.1:8765/qa/root-subject-nav-v1.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrongbook-root-subject-nav-qa
          path: |
            /tmp/wb-root-nav-dom.html
            /tmp/wrongbook-root-subject-nav.png
          if-no-files-found: warn
