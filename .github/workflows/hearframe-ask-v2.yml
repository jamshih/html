name: Build Ask Hearframe Forced-Aligned Corpus

on:
  push:
    branches: [main]
    paths:
      - 'hearframe-grand-v4/ask-v2-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg + WhisperX
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'whisperx>=3.3,<4'
      - name: Build forced-aligned corpus
        id: build
        continue-on-error: true
        run: python .github/scripts/build-hearframe-ask-v2.py > hearframe-grand-v4/ask/forced-corpus-build.log 2>&1
      - name: Render long regression answer
        if: steps.build.outcome == 'success'
        run: python .github/scripts/build-hearframe-long-answer.py >> hearframe-grand-v4/ask/forced-corpus-build.log 2>&1
      - name: Record build
        if: always()
        run: |
          echo "outcome=${{ steps.build.outcome }}" > hearframe-grand-v4/ask/forced-corpus-result.txt
          git config user.name 'hearframe-forced-corpus'
          git config user.email 'actions@users.noreply.github.com'
          git add hearframe-grand-v4/ask/corpus.json hearframe-grand-v4/ask/media hearframe-grand-v4/ask/forced-corpus-build.json hearframe-grand-v4/ask/forced-corpus-build.log hearframe-grand-v4/ask/forced-corpus-result.txt hearframe-grand-v4/ask/long-sentence-qa.json || true
          git commit -m 'Rebuild Ask Hearframe with forced word alignment [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if corpus build failed
        if: steps.build.outcome != 'success'
        run: exit 1
