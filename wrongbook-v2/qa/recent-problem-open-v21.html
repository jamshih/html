<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><title>Wrongbook recent problem open QA</title></head>
<body data-status="RUNNING">
<pre id="result">RUNNING</pre>
<script>
(async()=>{
  const problemId='scan-recent-crash-qa';
  const now=new Date().toISOString();
  const problem={
    id:problemId,subject:'math',title:'10. 空間中有兩點 A(1, 5, -4)、B(-14, 15',concept:'空間中的直線與平面',conceptCode:'MATH-GEO-SPACE',chapter:'空間向量',student:[],correct:[],mastery:54,due:'今天',mistakeType:'參數與法向量關係',attempts:1,
    problemText:'10. 空間中有兩點 A(1, 5, -4)、B(-14, 15, 6)，已知點 P(-5, r, s) 在 AB 上。若平面通過 P 點且與直線 AB 垂直，且此平面方程式為 3x + by + cz + d = 0，求序組 (r, s, d)。',
    options:[],corrections:{},insight:'',aiChapterHint:'',confirmed:true,responseType:'free_response',cleanQuestionFile:'',cleanQuestionFileMeta:null,ocrPrintedCrop:'',ocrResult:null,sourceImage:''
  };
  const stages=[
    {id:'qa-s1',stageType:'hint',goal:'先找 AB 的方向向量',promptToStudent:'先用 B-A 找出直線 AB 的方向向量。',successCriteria:'寫出 AB 方向向量',waitForStudent:true,actions:[]},
    {id:'qa-s2',stageType:'worked_step',goal:'利用 P 在 AB 上',promptToStudent:'令 P=A+t(B-A)，利用 x=-5 求 t，再求 r、s。',successCriteria:'求出 P 座標',waitForStudent:true,actions:[]},
    {id:'qa-s3',stageType:'hint',goal:'建立垂直平面',promptToStudent:'因平面與 AB 垂直，所以 AB 的方向向量可作為平面的法向量。',successCriteria:'連結方向向量與法向量',waitForStudent:true,actions:[]}
  ];
  const stored={page:'home',subject:'math',selectedProblemId:problemId,problems:[problem],tutorSessions:{[problemId]:{id:'qa-session',problemId,mode:'instructive',stages,activeIndex:0,status:'ready',diagnosis:{studentOnRightTrack:true},assistanceLevel:'hint',attempts:1,requestCount:1,createdAt:now,updatedAt:now}},aiGuideMode:'instructive',annotations:[],notes:[],mindAnswers:{},mindHints:{},mindChapter:{},mindRevealed:{},mobileMenu:false,aiLoading:false,aiError:''};
  localStorage.setItem('wrongbook-v2-state',JSON.stringify(stored));
  localStorage.removeItem('wrongbook-v2-ink');

  const out=document.getElementById('result');
  const iframe=document.createElement('iframe');
  iframe.style.cssText='width:1280px;height:900px;border:0;position:absolute;left:-10000px;top:0';
  document.body.appendChild(iframe);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const errors=[];
  const fail=message=>{throw new Error(message)};

  iframe.src='../index.html?qaRecentProblemOpen=1';
  await new Promise((resolve,reject)=>{iframe.onload=resolve;setTimeout(()=>reject(new Error('index load timeout')),10000)});
  const w=iframe.contentWindow,d=w.document;
  w.addEventListener('error',e=>errors.push('error: '+(e.message||e.error?.message||'unknown')));
  w.addEventListener('unhandledrejection',e=>errors.push('rejection: '+(e.reason?.message||String(e.reason||'unknown'))));
  const originalError=w.console.error.bind(w.console);w.console.error=(...args)=>{errors.push('console.error: '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '));originalError(...args)};

  await sleep(2200);
  if(w.state?.page!=='home')fail('app did not start on home');
  const recent=d.querySelector(`[data-problem="${problemId}"]`);
  if(!recent)fail('recent problem control not found');

  recent.click();
  await sleep(1800);
  if(w.state?.page!=='notebook')fail('recent problem click did not enter notebook');
  if(w.state?.selectedProblemId!==problemId)fail('selected problem id changed unexpectedly');
  const workspace=d.querySelector('.pf-problem-workspace');
  if(!workspace)fail('problem workspace missing after recent click');
  if(!d.querySelector('#drawCanvas'))fail('drawing canvas missing');
  if(!d.querySelector('.paper-toolbar,.ocrq-toolbar'))fail('writing toolbar missing');
  if(!d.querySelector('[data-action="undoInk"]'))fail('undo missing');
  if(!d.querySelector('[data-action="redoInk"]'))fail('redo missing');

  const dock=d.querySelector('.v5-tutor-dock');
  if(!dock)fail('tutor dock missing');
  const navs=[...d.querySelectorAll('.v16-canonical-nav')].filter(el=>getComputedStyle(el).display!=='none');
  const legacy=[...d.querySelectorAll('.v5-tutor-history-nav,.v7-tutor-step-nav,.v5-tutor-step-nav')].filter(el=>getComputedStyle(el).display!=='none');
  if(navs.length!==1)fail('expected exactly one compact navigator, got '+navs.length);
  if(legacy.length)fail('legacy navigator visible');
  const nav=navs[0],counter=nav.querySelector('.v14-tutor-nav-count');
  if(counter?.textContent.trim()!=='1 / 3')fail('unexpected initial navigator count: '+counter?.textContent);

  const metrics=w.__wrongbookTutorNavV16Metrics;
  const settleStart={callbacks:metrics?.observerCallbacks||0,passes:metrics?.normalizationPasses||0,changes:metrics?.domChanges||0};
  await sleep(900);
  const settleEnd={callbacks:metrics?.observerCallbacks||0,passes:metrics?.normalizationPasses||0,changes:metrics?.domChanges||0};
  const idlePassDelta=settleEnd.passes-settleStart.passes;
  const idleChangeDelta=settleEnd.changes-settleStart.changes;
  if(idlePassDelta>4||idleChangeDelta>1)fail(`navigator observer did not settle: passes +${idlePassDelta}, changes +${idleChangeDelta}`);

  const sameDock=dock;
  nav.querySelector('[data-v15-tutor-next]')?.click();
  await sleep(250);
  if(d.querySelector('.v5-tutor-dock')!==sameDock)fail('tutor dock was recreated on next');
  if(d.querySelector('.v14-tutor-nav-count')?.textContent.trim()!=='2 / 3')fail('next did not update navigator count');
  d.querySelector('[data-v15-tutor-prev]')?.click();
  await sleep(250);
  if(d.querySelector('.v5-tutor-dock')!==sameDock)fail('tutor dock was recreated on previous');
  if(d.querySelector('.v14-tutor-nav-count')?.textContent.trim()!=='1 / 3')fail('previous did not restore navigator count');

  const navQA=w.wrongbookTutorNavVisualQA?.()||null;
  const tutorQA=w.wrongbookTutorDialogCompactQA?.()||null;
  const universalQA=w.wrongbookUniversalTutorAccessQA?.()||null;
  if(navQA&&navQA.pass!==true)fail('navigator runtime QA failed: '+JSON.stringify(navQA));
  if(tutorQA&&tutorQA.pass!==true)fail('tutor dialog QA failed: '+JSON.stringify(tutorQA));
  if(universalQA&&universalQA.pass!==true)fail('universal tutor QA failed: '+JSON.stringify(universalQA));
  if(errors.length)fail('runtime errors after click: '+errors.join(' | '));

  const result={pass:true,flow:'home -> recent wrong problem -> workspace -> next -> previous',page:w.state.page,selectedProblemId:w.state.selectedProblemId,workspacePresent:true,canvasPresent:true,undoPresent:true,redoPresent:true,canonicalNavigatorCount:navs.length,legacyNavigatorCount:legacy.length,idleObserverPassDelta:idlePassDelta,idleDomChangeDelta:idleChangeDelta,sameTutorDockAcrossPaging:true,navQA,tutorQA,universalQA,runtimeErrors:errors};
  document.body.dataset.status='PASS';out.textContent=JSON.stringify(result,null,2);
})().catch(err=>{document.body.dataset.status='FAIL';document.getElementById('result').textContent=JSON.stringify({pass:false,error:err.message,stack:err.stack},null,2)});
</script>
</body>
</html>
