<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wrongbook subject selector visual QA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="appFrame" src="../index.html?qaSubjectVisual=1"></iframe><script>
(async()=>{
  const frame=document.getElementById('appFrame');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  await new Promise(resolve=>{if(frame.contentDocument?.readyState==='complete')resolve();else frame.addEventListener('load',resolve,{once:true})});
  await sleep(2200);
  const w=frame.contentWindow;
  try{w.eval("state.page='mindmap'; state.subject='biology'; state.mobileMenu=false; render()") }catch(e){document.body.dataset.error=e.message;return}
  for(let i=0;i<40&&!frame.contentDocument.getElementById('mmSubjectSelect');i++)await sleep(100);
  document.body.dataset.ready=frame.contentDocument.getElementById('mmSubjectSelect')?'1':'0';
})();
</script></body></html>
