<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="qa-run" content="root-subject-nav-v1"><title>Wrongbook root subject nav QA</title><style>html,body{margin:0;background:#ddd;font-family:system-ui}#result{position:fixed;z-index:99;top:4px;left:4px;max-width:520px;max-height:180px;overflow:auto;margin:0;padding:8px;background:rgba(255,255,255,.94);font-size:11px;white-space:pre-wrap}iframe{border:1px solid #aaa;background:white}</style></head><body data-status="RUNNING"><pre id="result">RUNNING</pre><script>
(async()=>{
  const out=document.getElementById('result');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const fail=msg=>{throw new Error(msg)};
  const runtimeErrors=[];

  async function boot(name,width,height){
    const iframe=document.createElement('iframe');
    iframe.dataset.qa=name;
    iframe.style.cssText=`width:${width}px;height:${height}px;position:absolute;left:-10000px;top:0`;
    document.body.appendChild(iframe);
    iframe.src=`../index.html?qaRootSubjectNav=${name}&t=${Date.now()}`;
    await new Promise((resolve,reject)=>{iframe.onload=resolve;setTimeout(()=>reject(new Error(name+' load timeout')),12000)});
    const w=iframe.contentWindow,d=w.document,errors=[];
    w.addEventListener('error',e=>errors.push(e.message||String(e.error||'unknown')));
    w.addEventListener('unhandledrejection',e=>errors.push(e.reason?.message||String(e.reason||'unknown')));
    await sleep(3000);
    runtimeErrors.push(...errors.map(x=>name+': '+x));
    return{iframe,w,d,state:()=>w.eval('state'),subjects:()=>w.eval('SUBJECTS.map(s=>({id:s.id,name:s.name,symbol:s.symbol||""}))')};
  }

  function isVisible(d,el){if(!el)return false;const s=d.defaultView.getComputedStyle(el),r=el.getBoundingClientRect();return !el.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}
  function assertHitTarget(d,el,label){const r=el.getBoundingClientRect();if(r.width<2||r.height<2)fail(label+' has no size');const x=Math.max(0,Math.min(d.documentElement.clientWidth-1,r.left+r.width/2)),y=Math.max(0,Math.min(d.documentElement.clientHeight-1,r.top+r.height/2));const hit=d.elementFromPoint(x,y);if(!hit||!(hit===el||el.contains(hit)||hit.closest?.('[data-mm-root-subject]')===el))fail(label+' does not receive pointer events; hit '+(hit?.id||hit?.className||hit?.tagName||'nothing'))}

  async function openBiologyMindmap(ctx){
    ctx.w.eval("state.subject='biology';state.page='mindmap';state.mobileMenu=false;render()");
    for(let i=0;i<60&&!ctx.d.querySelector('#mmSvg g.node.root');i++)await sleep(100);
    for(let i=0;i<60&&!ctx.d.getElementById('mmSubjectSelect');i++)await sleep(100);
    for(let i=0;i<60&&!ctx.d.getElementById('mmRootSubjectNav');i++)await sleep(100);
    if(!ctx.d.querySelector('#mmSvg g.node.root'))fail('root missing');
    if(!ctx.d.getElementById('mmRootSubjectNav'))fail('root subject navigator did not load');
  }

  async function collapseRoot(ctx,label){
    const root=ctx.d.querySelector('#mmSvg g.node.root');
    const circle=root?.querySelector('circle');
    if(!root||!circle)fail(label+' root/circle missing');
    assertHitTarget(ctx.d,circle,label+' root circle');
    circle.dispatchEvent(new ctx.w.MouseEvent('click',{bubbles:true,cancelable:true,view:ctx.w}));
    await sleep(900);
    const freshRoot=ctx.d.querySelector('#mmSvg g.node.root');
    const nav=ctx.d.getElementById('mmRootSubjectNav');
    if(!freshRoot?.classList.contains('collapsed'))fail(label+' root did not collapse');
    if(!isVisible(ctx.d,nav))fail(label+' subject navigator not visible in root overview');
    return nav;
  }

  async function verify(ctx,label,subjects,targetId){
    await openBiologyMindmap(ctx);
    const navBefore=ctx.d.getElementById('mmRootSubjectNav');
    if(isVisible(ctx.d,navBefore))fail(label+' subject navigator visible before root collapse');
    const toolbarSelect=ctx.d.getElementById('mmSubjectSelect');
    if(!toolbarSelect||toolbarSelect.value!=='biology')fail(label+' existing subject select changed/broken');
    if(!ctx.d.getElementById('mmDraw')||!ctx.d.getElementById('mmAiCheck'))fail(label+' existing mind-map toolbar changed');

    const nav=await collapseRoot(ctx,label);
    const buttons=[...nav.querySelectorAll('[data-mm-root-subject]')];
    if(buttons.length!==subjects.length)fail(label+` expected ${subjects.length} subject buttons, got ${buttons.length}`);
    for(const s of subjects){if(!buttons.some(b=>b.dataset.mmRootSubject===s.id))fail(label+' missing subject '+s.id)}
    const active=nav.querySelector('[data-mm-root-subject][aria-current]');
    if(active?.dataset.mmRootSubject!=='biology')fail(label+' current Biology button not marked active');
    const target=nav.querySelector(`[data-mm-root-subject="${targetId}"]`);
    if(!target)fail(label+' target subject missing: '+targetId);
    target.scrollIntoView({block:'nearest',inline:'center'});await sleep(80);assertHitTarget(ctx.d,target,label+' '+targetId+' button');
    target.click();
    for(let i=0;i<60&&ctx.state().subject!==targetId;i++)await sleep(100);
    await sleep(450);
    if(ctx.state().subject!==targetId)fail(label+' subject click did not switch to '+targetId);
    if(ctx.state().page!=='mindmap')fail(label+' subject switch left mindmap page');
    if(!ctx.d.querySelector('#mmSvg g.node.root'))fail(label+' target map root missing after switch');
    if(ctx.d.getElementById('mmSubjectSelect')?.value!==targetId)fail(label+' toolbar subject select did not sync after switch');
    const targetNav=ctx.d.getElementById('mmRootSubjectNav');
    if(isVisible(ctx.d,targetNav))fail(label+' root navigator should hide after destination map expands');
    return{buttonCount:buttons.length,targetId};
  }

  localStorage.removeItem('wrongbook-v2-state');
  const desktop=await boot('desktop',1100,850);
  const subjects=desktop.subjects();
  if(subjects.length!==10)fail('expected 10 subjects, got '+subjects.length);
  const desktopResult=await verify(desktop,'desktop',subjects,'math');

  localStorage.removeItem('wrongbook-v2-state');
  const mobile=await boot('mobile',390,844);
  const mobileResult=await verify(mobile,'mobile',subjects,'earth');

  // Leave both frames in the exact overview state for visual QA.
  await openBiologyMindmap(desktop);await collapseRoot(desktop,'desktop visual');
  await openBiologyMindmap(mobile);await collapseRoot(mobile,'mobile visual');
  desktop.iframe.style.cssText='width:1040px;height:850px;position:absolute;left:0;top:0';
  mobile.iframe.style.cssText='width:390px;height:850px;position:absolute;left:1050px;top:0';

  const rootNavVersion=desktop.w.WrongBookMindmapRootSubjectNav?.version||'';
  const subjectNavVersion=desktop.w.WrongBookMindmapSubjectNav?.version||'';
  if(rootNavVersion!=='2026-08-18-root-subject-nav-v1')fail('wrong root nav version '+rootNavVersion);
  if(subjectNavVersion!=='2026-08-18-mindmap-subject-nav-v3')fail('wrong subject nav version '+subjectNavVersion);
  if(runtimeErrors.length)fail('runtime errors: '+runtimeErrors.join(' | '));

  const result={pass:true,flow:'biology expanded -> root click -> subject palette -> subject switch',subjectCount:subjects.length,desktopResult,mobileResult,rootNavVersion,subjectNavVersion,runtimeErrors};
  document.body.dataset.status='PASS';out.textContent=JSON.stringify(result,null,2);
})().catch(err=>{document.body.dataset.status='FAIL';document.getElementById('result').textContent=JSON.stringify({pass:false,error:err.message,stack:err.stack},null,2)});
</script></body></html>
