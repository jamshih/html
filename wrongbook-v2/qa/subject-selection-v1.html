<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="qa-run" content="subject-selection-v3"><title>Wrongbook subject selection QA</title></head>
<body data-status="RUNNING"><pre id="result">RUNNING</pre><script>
(async()=>{
  const out=document.getElementById('result');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const fail=message=>{throw new Error(message)};
  const allErrors=[];

  async function boot(name,width,height){
    const iframe=document.createElement('iframe');
    iframe.dataset.qa=name;
    iframe.style.cssText=`width:${width}px;height:${height}px;border:0;position:absolute;left:-10000px;top:0`;
    document.body.appendChild(iframe);
    iframe.src=`../index.html?qaSubjectSelection=${encodeURIComponent(name)}&t=${Date.now()}`;
    await new Promise((resolve,reject)=>{iframe.onload=resolve;setTimeout(()=>reject(new Error(name+' index load timeout')),12000)});
    const w=iframe.contentWindow,d=w.document,errors=[];
    w.addEventListener('error',e=>errors.push('error: '+(e.message||e.error?.message||'unknown')));
    w.addEventListener('unhandledrejection',e=>errors.push('rejection: '+(e.reason?.message||String(e.reason||'unknown'))));
    await sleep(2800);
    allErrors.push(...errors.map(e=>name+': '+e));
    return{iframe,w,d,errors,state:()=>w.eval('state'),subjects:()=>w.eval('SUBJECTS.map(s=>({id:s.id,name:s.name}))')};
  }

  function assertHitTarget(d,el,label){
    const r=el.getBoundingClientRect();
    if(r.width<2||r.height<2)fail(label+' has no clickable size');
    const x=Math.max(0,Math.min(d.documentElement.clientWidth-1,r.left+r.width/2));
    const y=Math.max(0,Math.min(d.documentElement.clientHeight-1,r.top+r.height/2));
    const hit=d.elementFromPoint(x,y);
    if(!hit||!(hit===el||el.contains(hit)))fail(label+' does not receive pointer events; hit '+(hit?.className||hit?.tagName||'nothing'));
  }

  async function goMindmap(ctx){
    ctx.w.eval("state.page='mindmap'; state.mobileMenu=false; render()");
    for(let i=0;i<50&&!ctx.d.getElementById('mmSubjectSelect');i++)await sleep(120);
    if(!ctx.d.getElementById('mmSubjectSelect'))fail(ctx.iframe.dataset.qa+' mind-map subject selector did not appear');
  }

  async function verifyMindmap(ctx,targets,label){
    await goMindmap(ctx);
    let wrap=ctx.d.getElementById('mmWrap'),select=ctx.d.getElementById('mmSubjectSelect');
    if(!wrap||!select||!ctx.d.getElementById('mmSvg'))fail(label+' mind-map controls missing');
    if(wrap.hasAttribute('data-subject'))fail(label+' mind-map wrapper still exposes interactive data-subject');
    if(wrap.onclick)fail(label+' mind-map wrapper still owns a click handler');
    assertHitTarget(ctx.d,select,label+' mind-map subject select');

    const originalSelect=select;
    select.dispatchEvent(new ctx.w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:1,pointerType:label==='mobile'?'touch':'mouse'}));
    select.dispatchEvent(new ctx.w.MouseEvent('click',{bubbles:true,cancelable:true,view:ctx.w}));
    await sleep(120);
    if(!originalSelect.isConnected)fail(label+' clicking subject select destroyed it before change');
    if(ctx.state().page!=='mindmap')fail(label+' clicking subject select changed page before selection');

    const results=[];
    for(const id of targets){
      select=ctx.d.getElementById('mmSubjectSelect');
      if(!select)fail(label+' selector missing before '+id);
      select.value=id;
      select.dispatchEvent(new ctx.w.Event('change',{bubbles:true}));
      for(let i=0;i<50&&ctx.state().subject!==id;i++)await sleep(80);
      await sleep(260);
      if(ctx.state().subject!==id)fail(label+' selection failed for '+id+'; got '+ctx.state().subject);
      if(ctx.state().page!=='mindmap')fail(label+' selection left mindmap for '+id+': '+ctx.state().page);
      wrap=ctx.d.getElementById('mmWrap');select=ctx.d.getElementById('mmSubjectSelect');
      const svg=ctx.d.getElementById('mmSvg');
      if(!wrap||!select||!svg)fail(label+' mind-map DOM missing after '+id);
      if(wrap.hasAttribute('data-subject')||wrap.onclick)fail(label+' wrapper interception returned after '+id);
      if(select.value!==id)fail(label+' selector value mismatch for '+id+': '+select.value);
      assertHitTarget(ctx.d,select,label+' selector after '+id);
      const qa=ctx.w.WrongBookMindmapSubjectNav?.qa?.();
      if(!qa||qa.pass!==true)fail(label+' subject nav QA failed after '+id+': '+JSON.stringify(qa));
      results.push({id,nodeCount:svg.querySelectorAll('g.node').length,qa});
    }
    return results;
  }

  localStorage.removeItem('wrongbook-v2-state');
  localStorage.removeItem('wrongbook-v2-ink');
  const desktop=await boot('desktop',1280,900);
  const subjects=desktop.subjects();
  if(subjects.length<8)fail('unexpected subject count '+subjects.length);
  const ids=subjects.map(s=>s.id);
  const desktopResults=await verifyMindmap(desktop,ids,'desktop');

  localStorage.removeItem('wrongbook-v2-state');
  const mobile=await boot('mobile',390,844);
  const preferred=['biology','math','earth','chemistry','physics','chinese','english'];
  const mobileTargets=preferred.filter(id=>ids.includes(id));
  if(mobileTargets.length<4)fail('not enough mobile subject targets');
  const mobileResults=await verifyMindmap(mobile,mobileTargets,'mobile');

  const build=desktop.d.querySelector('meta[name="wrongbook-build"]')?.content||'';
  if(build!=='2026-08-18-subject-selection-2000')fail('wrong production build loaded: '+build);
  const geometryScript=[...desktop.d.scripts].find(s=>s.src.includes('mindmap-radial-runtime-fix-v3.js'))?.src||'';
  if(!geometryScript.includes('20260818-geometry-5'))fail('geometry-5 cache key not loaded: '+geometryScript);
  const subjectNavScript=[...desktop.d.scripts].find(s=>s.src.includes('mindmap-subject-nav-v1.js'))?.src||'';
  if(!subjectNavScript.includes('mindmap-subject-nav-v2'))fail('subject-nav-v2 cache key not loaded: '+subjectNavScript);
  if(allErrors.length)fail('runtime errors: '+allErrors.join(' | '));

  const result={pass:true,flow:'mind-map subject selector pointer survival + every desktop subject + representative mobile subjects',build,subjectCount:subjects.length,desktopResults,mobileResults,runtimeErrors:allErrors};
  document.body.dataset.status='PASS';out.textContent=JSON.stringify(result,null,2);
})().catch(err=>{document.body.dataset.status='FAIL';document.getElementById('result').textContent=JSON.stringify({pass:false,error:err.message,stack:err.stack},null,2)});
</script></body></html>
