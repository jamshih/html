<script>const state={chemistryAnswers:{},chemistryMode:'recall',chemistryTrack:'gsat',chemistryPageId:'gsat-02'};function esc(s=''){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function save(){}function render(){}function mindmapPage(){return''}function bind(){}function activeSubject(){return{id:'chemistry',name:'化學'}}function subjectTabs(){return''}</script>
</head><body><div id="qa-root"><div class="qa-paper-wrap" id="paper"></div><pre class="qa-readout" id="qa">rendering…</pre></div>
<script src="../chemistry-reference-v1.js"></script><script src="../chemistry-reference-scope-page1-v2.js"></script><script src="../chemistry-reference-page1-fix-v3.js"></script><script src="../chemistry-gsat-page2-v4.js"></script>
<script>
(function(){
 const page=CHEMISTRY_GSAT_PAGE_2,target=document.getElementById('paper');target.innerHTML=chemPaper(page,'recall');
 function overlap(a,b,pad=2){return a.left<b.right-pad&&a.right>b.left+pad&&a.top<b.bottom-pad&&a.bottom>b.top+pad}
 function domQa(){const paper=document.querySelector('.chem-paper'),clusters=[...paper.querySelectorAll('.chem-cluster')],figures=[...paper.querySelectorAll('.chem-figure')],questions=[...paper.querySelectorAll('.chem-question')],inputs=[...paper.querySelectorAll('.chem-input-shell')];const overflowClusters=clusters.filter(el=>el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+2).map(el=>el.className);const figureQuestionCollisions=[];figures.forEach(f=>{const fr=f.getBoundingClientRect();questions.forEach(q=>{if(f.closest('.chem-cluster')===q.closest('.chem-cluster')&&overlap(fr,q.getBoundingClientRect()))figureQuestionCollisions.push([f.dataset.chemFigure,q.dataset.chemQuestion])})});const inputOutsideCluster=inputs.filter(el=>{const r=el.getBoundingClientRect(),c=el.closest('.chem-cluster')?.getBoundingClientRect();return c&&(r.left<c.left-1||r.right>c.right+1||r.top<c.top-1||r.bottom>c.bottom+1)}).length;const minQuestionFont=Math.min(...questions.map(q=>parseFloat(getComputedStyle(q).fontSize)||99));const recallLeakNodes=[...paper.querySelectorAll('.chem-learn-answer')].length;return{page:page.id,overflowClusters,figureQuestionCollisions,inputOutsideCluster,minQuestionFont,recallLeakNodes,figures:figures.length,questions:questions.length,ok:overflowClusters.length===0&&figureQuestionCollisions.length===0&&inputOutsideCluster===0&&minQuestionFont>=12&&recallLeakNodes===0}}
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const staticQa=chemistryReferenceQa(page),layoutQa=domQa(),expected={questions:21,blanks:24,figures:12},expectedOk=staticQa.questions===expected.questions&&staticQa.blanks===expected.blanks&&staticQa.figures===expected.figures,pass=staticQa.ok&&layoutQa.ok&&expectedOk;document.documentElement.dataset.qaPass=pass?'true':'false';document.documentElement.dataset.qaQuestions=staticQa.questions;document.documentElement.dataset.qaBlanks=staticQa.blanks;document.documentElement.dataset.qaFigures=staticQa.figures;const out={pass,expected,staticQa,domQa:layoutQa};const qa=document.getElementById('qa');qa.classList.add(pass?'qa-pass':'qa-fail');qa.textContent=JSON.stringify(out,null,2);console.log('CHEMISTRY_PAGE2_QA '+JSON.stringify(out))}));
})();
